# Корневой конфиг — только общее для всех профилей: имя приложения,
# подключение к Vault, JPA, Flyway, okx (base-url + мэппинг кредов).
# Профиле-зависимое (Vault-пути datasource + OKX, джобы candle-loading /
# market-data, okx.simulated, уровень логов) вынесено в application-prod.yaml
# / application-test.yaml. Запуск требует активного профиля (prod|test):
# без него datasource/креды не заданы и приложение не поднимается.
spring:
  application:
    name: tradingbot
  # Подключение к Vault — общее; конкретные KV-пути (datasource + OKX-креды)
  # задаются по профилю через spring.config.import в application-{prod,test}.yaml
  # (prod → postgres + okx, test → postgres-test + okx-test).
  cloud:
    bootstrap:
      # Используем spring.config.import (vault://), а не bootstrap-контекст.
      enabled: false
    vault:
      enabled: true
      uri: ${VAULT_URI:http://localhost:8200}
      authentication: TOKEN
      token: ${VAULT_TOKEN:}
      kv:
        enabled: true
        backend: secret
        application-name: tradingbot
  jpa:
    open-in-view: false
    hibernate:
      # Источник истины схемы — Flyway-миграции, Hibernate схему не правит.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Интеграция с OKX. base-url — общий (env-дефолт). Приватные креды
# (api-key/secret/passphrase) читаются из Vault per-profile, как datasource:
# prod → secret/tradingbot/okx, test → secret/tradingbot/okx-test (импорт
# пути — в application-{prod,test}.yaml). Мэппинг ключей Vault → свойства
# одинаков для обоих профилей, поэтому здесь, в корне. Шаг 9 «Безопасность» —
# остаточный хардненинг, не ввод секретов.
# Демо-флаг simulated — профиле-зависим (prod=real, test=demo), см. профили.
okx:
  base-url: ${OKX_BASE_URL:https://www.okx.com}
  # Ключи секрета Vault: OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE.
  api-key: ${OKX_API_KEY}
  secret: ${OKX_SECRET_KEY}
  passphrase: ${OKX_PASSPHRASE}

# Аварийный kill-switch (KillSwitchExecutor). max-teardown-attempts — лимит
# попыток teardown «снять риск → сверить flat рефрешем» до эскалации на биржевой
# холд (HOLD-Q1); значение — риск-владельца.
kill-switch:
  max-teardown-attempts: 3

# Настройки контура биржи (дом перечня — docs/models/domain/core/Exchange.md).
# Ключ секции — имя биржи (Exchange.name). Отображение категорий движений и
# список исключений сверки — стартовый набор OKX взят из правила источника
# (docs/integrations/okx/rules/cash-flow-categories.md) и наблюдением не
# подтверждён: непокрытый тип садится в OTHER с отчётом UNCLASSIFIED_CASH_FLOW;
# пополняет держатель по наблюдённому перечню. Типового умолчания у «5» нет
# намеренно: тип гетерогенен (закрытия + штраф), склейка завысила бы штраф.
exchange-contour:
  exchanges:
    OKX:
      cash-flow-category-mapping:
        "2": REALIZED_PNL
        "8": FUNDING
        "9": REALIZED_PNL
        "5/100": REALIZED_PNL
        "5/101": REALIZED_PNL
        "5/102": REALIZED_PNL
        "5/103": REALIZED_PNL
        "5/104": REALIZED_PNL
        "5/105": REALIZED_PNL
        "5/106": REALIZED_PNL
        "5/107": REALIZED_PNL
        "5/116": LIQ_PENALTY
      reconciliation-exclusions:
        - "2/407"
        - "2/408"
        - "2/410"
        - "2/411"
        - "2/412"
        - "2/413"
