spring:
  application:
    name: tradingbot
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tradingbot}
    username: ${DB_USERNAME:tradingbot}
    password: ${DB_PASSWORD:tradingbot}
  jpa:
    open-in-view: false
    hibernate:
      # Источник истины схемы — Flyway-миграции, Hibernate схему не правит.
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# Интеграция с OKX. Шаг 1 ходит только в публичные endpoint'ы
# (instruments/candles) — auth/секреты не нужны. API-ключи и
# конфигурация секретов (Vault) вводятся с приватными endpoint'ами и
# на шаге 9 «Безопасность» (tech-radar: по потребности шага).
okx:
  base-url: ${OKX_BASE_URL:https://www.okx.com}
  # Демо-флаг OKX: "1" — demo trading (header x-simulated-trading), пусто — реальный.
  simulated: ${OKX_SIMULATED:1}

# Загрузка свечей (docs/processes/candle-loading.md). Числа
# конфигурируемы, проставляются на CODE.
candle-loading:
  # Период тика CandleJob (CRON), порядка раза в минуту.
  cron: ${CANDLE_JOB_CRON:0 * * * * *}
  # Лимит свечей в одном запросе OKX history-candles (max 100).
  page-size: 100
  # Число попыток REPAIR до перевода группы в ERROR.
  max-repair-attempts: 5
  # Перекрытие хвоста при SYNC (число последних баров перезапрашивается).
  sync-overlap-bars: 3
  # Дефолтный плановый горизонт истории (UTC мс) при онбординге
  # инструмента, если не задан явно.
  default-planned-start-date: ${CANDLE_DEFAULT_PLANNED_START:0}
  # Таймфреймы, под которые заводятся группы свечей инструмента.
  # На шаге 1 (без стратегии) — из конфига; со стратегией (шаг 2) —
  # из запрошенных стратегией индикаторов.
  timeframes:
    - ONE_HOUR

logging:
  level:
    com.example.tradingbot: INFO
