# Профиль test: Vault-пути secret/tradingbot/postgres-test (datasource) +
# secret/tradingbot/okx-test (OKX-креды). Имена ключей — те же, что в prod,
# в своих путях (datasource URL → :5441).
spring:
  config:
    import:
      - vault://secret/tradingbot/postgres-test
      - vault://secret/tradingbot/okx-test
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

okx:
  # test — demo trading: simulated "1" (header x-simulated-trading).
  simulated: ${OKX_SIMULATED:1}

# Джобы — те же значения, что в prod; разнесены по профилю, чтобы при
# необходимости расходиться независимо (смысл см. в application-prod.yaml
# и docs/processes/{candle-loading,market-data-calculation}.md).
candle-loading:
  enabled: ${CANDLE_JOB_ENABLED:true}
  cron: ${CANDLE_JOB_CRON:0 * * * * *}
  page-size: 100
  max-repair-attempts: 5
  sync-overlap-bars: 3
  default-planned-start-date: ${CANDLE_DEFAULT_PLANNED_START:0}
  timeframes:
    - ONE_HOUR

market-data:
  candle-window-bars: ${MARKET_DATA_CANDLE_WINDOW_BARS:1500}
  indicator:
    enabled: ${INDICATOR_JOB_ENABLED:true}
    cron: ${INDICATOR_JOB_CRON:0 * * * * *}
  structure:
    enabled: ${MARKET_STRUCTURE_JOB_ENABLED:true}
    cron: ${MARKET_STRUCTURE_JOB_CRON:0 * * * * *}

# Синхронизация внешних правил инструмента — те же значения, что в prod
# (см. application-prod.yaml и docs/components/InstrumentExternalRulesSyncJob.md).
instrument-external-rules-sync:
  enabled: ${INSTRUMENT_RULES_SYNC_ENABLED:true}
  cron: ${INSTRUMENT_RULES_SYNC_CRON:0 0 * * * *}

# Поиск входов и сопровождение сделок — те же значения, что в prod
# (см. application-prod.yaml, docs/components/{EntryScannerJob,DealOrchestratorJob}.md).
entry-scanner:
  enabled: ${ENTRY_SCANNER_ENABLED:true}
  cron: ${ENTRY_SCANNER_CRON:0 * * * * *}

deal-orchestrator:
  enabled: ${DEAL_ORCHESTRATOR_ENABLED:true}
  cron: ${DEAL_ORCHESTRATOR_CRON:0 * * * * *}
  batch-size: ${DEAL_ORCHESTRATOR_BATCH_SIZE:100}

# ─── РИСК-АППЕТИТ ────────────────────────────────────────────────────────────
# Три числа, которыми система ограничивает саму себя. Смысл, единица и роль
# каждого в формулах — docs/rules/risk-policy.md §«Числа назначает держатель;
# пустое место — отказ» и docs/rules/loss-streak-halt.md; доки значений НЕ
# держат, они живут здесь.
#
# Умолчаний нет ни у одного: пустое число не пропускает действие, а отвергает
# его (что именно отвергается — ниже у каждого). Это сделано нарочно —
# придуманный машиной порог выглядит как контроль, но контролем не является.
#
# ЗДЕСЬ — ПРОФИЛЬ TEST (demo-контур OKX, деньги ненастоящие). Значения
# проставлены так, чтобы контур работал под эталонной стратегией репозитория
# и при этом ни одна проверка не была отключена «на всякий случай».
# Боевые числа задаются отдельно в application-prod.yaml.
risk-appetite:

  # МАКСИМАЛЬНЫЙ РИСК НА ОДНУ СДЕЛКУ — проценты от базы риска (свободного
  # остатка счёта). Работает в двух местах сразу: ограничивает риск, стоящий
  # под ударом одновременно, и служит первым сомножителем катастрофического
  # потолка (вместе с множителем ниже).
  #
  # БОЛЬШЕ — сделки крупнее, просадка серии глубже: три подряд убыточных по
  #   2 % съедают вшестеро больше, чем по 0.33 %. Ошибка в эту сторону тихая:
  #   пока рынок благосклонен, ничего не происходит.
  # МЕНЬШЕ — сделки мельче; на маленьком счёте размер упирается в минимальный
  #   лот инструмента и действие отвергается (SIZE_MIN_LOT_EXCEEDS_RISK_BUDGET),
  #   то есть торговли не будет вовсе. Ошибка в эту сторону громкая и видна
  #   сразу.
  # ПУСТО — отвергается всякое действие, создающее риск.
  #
  # 1.0 — учебниковый ориентир (корпус: risk-and-sizing) и ровно столько,
  # сколько объявляет эталонная стратегия репозитория: стратегия с бо́льшим
  # аппетитом будет отвергнута на создании, и эта охрана в test проверяема.
  global-simultaneous-risk-per-deal-percent: 1.0

  # ПРЕДЕЛ МНОЖИТЕЛЯ КАТАСТРОФИЧЕСКОГО ПОТОЛКА — во сколько раз стратегии
  # позволено растянуть «сколько сделка потеряет в худшем мыслимом исходе»
  # сверх числа выше. Само число тут НЕ множитель сделки: множитель объявляет
  # стратегия, а это — планка, выше которой её объявление не принимается.
  # Потолок = риск-на-сделку × множитель × база, и он же кэп суммарного
  # номинала сделки (худший мыслимый ход принят равным 100 %).
  #
  # БОЛЬШЕ — стратегиям позволено брать больший номинал: катастрофический
  #   сценарий (защита не сработала, цена ушла целиком) стоит дороже.
  # МЕНЬШЕ — номинал сделки режется вместе с потолком; при слишком малом
  #   значении в потолок не влезает ни одна нога, и сделки не открываются
  #   (DEAL_NOTIONAL_EXCEEDED на первом же входе).
  # ПУСТО — отвергается создание стратегии: объявленный ею множитель не с чем
  #   сверить.
  #
  # 100.0 — при 1 % риска даёт потолок в одну базу: сделка не может потерять
  # в худшем мыслимом исходе больше, чем на счёте есть, и номинал не выходит
  # за пределы собственных средств. Столько же объявляет эталонная стратегия.
  global-catastrophic-risk-per-deal-multiplier: 100.0

  # ПРЕДЕЛ СЕРИИ УБЫТКОВ — сколько подряд ценово-убыточных закрытых сделок
  # останавливают торговлю целиком (мягкая ступень биржевого холда, разбор
  # руками). Прибыльная сделка обнуляет счётчик; серия меряется ценовым
  # результатом, без накопленного финансирования.
  #
  # БОЛЬШЕ — система дольше не замечает, что рынок ведёт себя не так, как
  #   предполагает стратегия: убытки успевают накопиться до разбора.
  # МЕНЬШЕ — торговля встаёт на обычной полосе невезения, и каждая остановка
  #   стоит ручного разбора; при 1-2 контур будет стоять чаще, чем работать.
  # ПУСТО — отвергается всякое действие, создающее риск
  #   (LOSS_LIMIT_NOT_CONFIGURED).
  #
  # 3 — остановка наступает достаточно рано, чтобы её увидеть в demo-прогоне,
  # и достаточно поздно, чтобы обычная серия неудач не блокировала контур.
  global-consecutive-loss-limit: 3

logging:
  level:
    com.example.tradingbot: DEBUG
