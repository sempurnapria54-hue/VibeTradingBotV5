# Конфигурация сервиса strategies.
#
# Значения осей окружения приезжают из манифеста окружения
# (deploy/<окружение>/env.yaml); здесь — только форма и умолчания,
# выбранные так, чтобы незаданное означало ОТКАЗ, а не разрешение.
spring:
  application:
    name: strategies
  security:
    oauth2:
      resourceserver:
        jwt:
          # Точка провайдера идентичности: по ней сервис забирает ключи и
          # проверяет подпись токена ЛОКАЛЬНО, без вызова auth на каждом
          # запросе (docs/architecture/contracts.md §«Контекст тенанта в
          # вызове»). Пустое означает, что контур доступа не настроен, и
          # контекст не поднимется — это отказ, а не открытая поверхность.
          issuer-uri: ${OIDC_ISSUER_URI:}
      client:
        # Исходящая идентичность: под ней владелец определений читает у
        # ядра числа риск-аппетита и разрешимость ссылок. Грант —
        # client credentials: пользователя в межсервисном вызове нет.
        registration:
          platform-services:
            client-id: ${SERVICE_CLIENT_ID:}
            client-secret: ${SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            provider: platform
        provider:
          platform:
            token-uri: ${OIDC_TOKEN_URI:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Подкаталог имени сервиса, а не корень локации: обход рекурсивный, и на
    # общем classpath корень собрал бы цепочки всех сервисов
    # (.claude/rules/codestyle.md §«Схема БД»).
    locations: classpath:db/migration/strategies

# Тропа публикации: адрес брокера.
#
# Ключ СВОЙ, а не spring.kafka.*: автоконфигурации Kafka в дереве нет —
# Boot 4 разнёс её по модулям spring-boot-<технология>, и свойства
# spring.kafka.* без такого модуля не читает никто (config/BrokerProperties).
# Клиент объявлен явно (config/StrategyKafkaConfig), подтверждение — от
# всех синхронных реплик (docs/architecture/data-ownership.md §«Outbox и
# доставка»).
#
# Пустое означает, что тропа публикации не настроена: реле отказывает и
# строки копятся, а переходы статуса от этого не зависят
# (docs/components/OutboxRelayJob.md).
broker:
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
  # Потолок ожидания брокера у публикующего клиента: столько отправка реле
  # ждёт раскладки темы, прежде чем отказать. Калибровочное число с
  # названным направлением — КОРОЧЕ: ложный отказ на медленном брокере
  # стоит одного повторного прохода, а долгое ожидание на мёртвом держит
  # поток планировщика дольше такта реле (docs/components/OutboxRelayJob.md).
  publish-block-timeout: ${KAFKA_PUBLISH_BLOCK_TIMEOUT:3s}

# Соседи, которых читает валидация и активация. Пустой адрес означает,
# что операнд не добыть — и тогда отвергается создание, а не проходит
# непроверенным (docs/rules/strategy-validation.md).
neighbours:
  trading-core:
    base-url: ${TRADING_CORE_BASE_URL:}
    client-registration-id: platform-services

# Внешняя поверхность: окно перечня определений тенанта. Безлимитного
# чтения у растущей таблицы не бывает (.claude/rules/codestyle.md
# §«Выборка данных»).
surface:
  strategy-list-window: ${SURFACE_STRATEGY_LIST_WINDOW:200}

jobs:
  outbox-relay:
    enabled: ${JOB_OUTBOX_RELAY_ENABLED:true}
    cron: ${JOB_OUTBOX_RELAY_CRON:0/5 * * * * *}
    batch-size: ${JOB_OUTBOX_RELAY_BATCH_SIZE:200}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Группы проб развёртывания: живость — /actuator/health/liveness,
      # готовность — /actuator/health/readiness; раскладка —
      # docs/architecture/platform.md, пункт «Пробы развёртывания». Обе —
      # подпути открытого исключения /actuator/health/**
      # (docs/rules/api-access-policy.md), и экспозиции сверх `health` им не
      # нужно. Флаг включён в Boot 4 умолчанием; объявлен здесь, потому что
      # манифест (deploy/base/services/strategies.yaml) опирается на пути
      # групп, а умолчание у флага уже менялось между линиями Boot.
      probes:
        enabled: true
      group:
        # ЖИВОСТЬ ГРУППЫ НЕ ОБЪЯВЛЯЕТ и остаётся умолчанием —
        # `livenessState`, состоянием самого процесса. База в ней гасила бы
        # под за недоступность, которую рестарт не лечит: проверка
        # соединения ждёт до 30 с, проба живости — 1 с, и kubelet
        # перезапускал под по кругу вместо «не готов».
        readiness:
          # Готовность — процесс плюс база: без неё сервис не принимает, не
          # читает и не переводит ни одного определения — всё его состояние
          # лежит строками его базы.
          include: readinessState,db
