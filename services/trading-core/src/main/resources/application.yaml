# Конфигурация сервиса trading-core.
#
# Значения осей окружения приезжают из манифеста окружения
# (deploy/<окружение>/env.yaml); здесь — только форма и умолчания,
# выбранные так, чтобы незаданное означало ОТКАЗ, а не разрешение.
spring:
  application:
    name: trading-core
  # РАЗМЕР ПУЛА ПЛАНИРОВЩИКА — величина, ВЫВЕДЕННАЯ ИЗ ЧИСЛА @Scheduled-методов
  # сервиса, а не калибруемая окружением: сколько у сервиса джоб, знает его
  # дерево, а не манифест, и плейсхолдер здесь был бы приглашением разойтись.
  # Умолчание каркаса — ОДИН поток на все семь джоб, а среди них есть
  # ИЗМЕРИТЕЛЬ: проактивная детекция мерит не свой продукт, а НАБЛЮДАЕМОСТЬ
  # контура, и её голодающий тик читается как «наблюдение идёт, аномалий нет»
  # — счёт слепоты двигают только состоявшиеся проходы
  # (.claude/rules/codestyle.md §Джобы, клауза «Операнда живости мало: такт
  # обязан ДОСТАТЬСЯ тику»). Счёт сверяет проба, а не глаз: SchedulerCapacityTest
  # считает @Scheduled-методы дерева и роняет сборку, если джоб стало больше,
  # чем потоков.
  #
  # ПРОХОДЫ ЯДРА СТАНОВЯТСЯ ОДНОВРЕМЕННЫМИ, и пары его джоб пройдены отдельным
  # ходом: общего они пишут мало, а всё общее разведено гардом запроса
  # (переход по стоящему статусу, атомарный инкремент, write-once) либо
  # инвариантом базы. Пары, разведения не имевшие, разведены — обе поимённо:
  #   - проекция реестра против торговых колонок строки счёта — признаком
  #     @DynamicUpdate на ExchangeAccountEntity;
  #   - проактивная детекция против прохода сделки на строке deals: детекция
  #     уводит активные сделки радиуса в ERROR каскадом жёсткой ступени, а
  #     четыре звена прохода писали строку ЦЕЛИКОМ снимком начала прохода и
  #     снимали этот каскад молча. Разведена переводом всех писателей
  #     существующей строки на точечные гардированные запросы; запись строки
  #     целиком заводит новую строку и на существующей ОТКАЗЫВАЕТ
  #     (docs/models/domain/aggregate/Deal.md §Персистентность).
  # Прежняя редакция этого комментария называла вторую пару разведённой на
  # посылке «детекция в сделки только ВСТАВЛЯЕТ»; посылка ложна — детекция
  # правит сделки обновлением.
  task:
    scheduling:
      pool:
        size: 7
  security:
    oauth2:
      resourceserver:
        jwt:
          # Точка провайдера идентичности: подпись входящего токена
          # проверяется локально по его ключам. Пустое означает, что контур
          # доступа не настроен, и поверхность не поднимется — это отказ.
          issuer-uri: ${OIDC_ISSUER_URI:}
      client:
        # Исходящая идентичность: под ней ядро ходит к коннектору, к auth
        # и к market-data (docs/architecture/contracts.md §«Контекст
        # тенанта в вызове»). Грант — client credentials: пользователя в
        # межсервисном вызове нет.
        registration:
          platform-services:
            client-id: ${SERVICE_CLIENT_ID:}
            client-secret: ${SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            provider: platform
        provider:
          platform:
            token-uri: ${OIDC_TOKEN_URI:}
  datasource:
    # База сервиса: ядро — единственный писатель торговых строк
    # (docs/architecture/data-ownership.md §Раскладка).
    url: ${TRADING_CORE_DB_URL:}
    username: ${TRADING_CORE_DB_USERNAME:}
    password: ${TRADING_CORE_DB_PASSWORD:}
    hikari:
      # ЧИСЛО ОБЪЯВЛЕНО ПОТОМУ, ЧТО СТАЛО НЕСУЩИМ. До объявления размера пула
      # планировщика одновременный проход был один, и подключений ему хватало
      # любых; теперь одновременных писателей семь плюс слушатель темы
      # определений, и сумма названных приблизилась к умолчанию. Само число
      # равно умолчанию каркаса — объявлено оно не ради поведения, а чтобы
      # следующий одновременный писатель не переполнил пул МОЛЧА: отказа при
      # этом не происходит, происходит ожидание, а затем таймаут у того
      # прохода, которому подключения не досталось.
      #
      # Направление калибровки названо: БОЛЬШЕ суммы одновременных писателей,
      # которых мы можем перечислить (7 джоб + 1 слушатель), с запасом на
      # входящую поверхность. Меньше — таймаут вместо работы; заметно
      # больше — бюджет соединений СУБД, делимый со всеми сервисами.
      maximum-pool-size: ${TRADING_CORE_DB_MAX_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      # Источник истины схемы — миграции Flyway; Hibernate схему не правит,
      # но СВЕРЯЕТ с ней свои сущности на старте. Прежнее `none` не сверяло
      # ничего: имя колонки, разошедшееся с миграцией, доживало до первого
      # запроса — то есть до тропы, которую в тесте никто не проходит.
      # Отказ на старте — единственная точка, где такое расхождение видно
      # раньше живого риска.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    # Брокер приезжает из манифеста окружения; пустое означает, что тропа
    # публикации не настроена — реле отказывает и строки копятся, а
    # решения от этого не зависят (docs/components/OutboxRelayJob.md).
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Подтверждение ОТ ВСЕХ синхронных реплик: отметка «опубликовано»
      # ставится после подтверждения, и более слабое обещание позволило бы
      # пометить строку, которую брокер потеряет вместе с лидером.
      acks: all
    consumer:
      # Группа потребителя объявлена ниже, в секции consumers: адрес темы
      # и имя группы — контракт, а не свойство транспорта.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # С НАЧАЛА темы: пропущенная активация оставила бы ядро без копии
      # определения, по которому оно торгует, — а тема фактов хранится
      # сроком заведомо большим допустимого отставания
      # (docs/architecture/data-ownership.md §«Outbox и доставка»).
      auto-offset-reset: earliest

# Темы, которые ядро ЧИТАЕТ. Первый потребитель в конструкции — три
# класса определения стратегии от сервиса strategies
# (docs/architecture/contracts.md §События).
consumers:
  strategy-facts:
    topic: strategies.facts
    group-id: trading-core.strategy-facts

platform:
  environment:
    name: ${PLATFORM_ENVIRONMENT:}

# Соседи по контракту. Адреса приезжают из манифеста окружения; пустое
# означает, что тропа не настроена, и вызов отказывает — лучше отказ, чем
# поход в чужое окружение.
neighbours:
  connector:
    exchange-code: ${CONNECTOR_EXCHANGE_CODE:}
    base-url: ${CONNECTOR_BASE_URL:}
    client-registration-id: platform-services
  auth:
    base-url: ${AUTH_BASE_URL:}
    client-registration-id: platform-services
  market-data:
    base-url: ${MARKET_DATA_BASE_URL:}
    client-registration-id: platform-services

# Тик синка проекций чужих реестров
# (docs/models/domain/core/Instrument.md §«Проекция у торгового ядра»).
# Период — калибровочная величина сервиса с названным направлением: ЧАЩЕ,
# чем реже. Чтение внутрикластерное и лимита площадки не тратит, поэтому
# ограничение сверху — не бюджет владельца, а нагрузка на его поверхность.
projection-sync:
  enabled: true
  cron: ${PROJECTION_SYNC_CRON:0 */5 * * * *}

# Синк ставок комиссии счетов (docs/models/domain/other/TradeFeeRate.md).
# Такт РЕДКИЙ намеренно: комиссионный тир счёта меняется по своей оси —
# объёмом торгов за период, — а не от прохода к проходу, и чтение это
# приватное, то есть тратит лимит площадки. Направление калибровки
# обратное соседнему тику: РЕЖЕ, чем чаще.
trade-fee-rate-sync:
  enabled: true
  cron: ${TRADE_FEE_RATE_SYNC_CRON:0 7 */6 * * *}

# Объявление потребности копий определения владельцу рыночных данных
# (docs/architecture/market-data-collection.md §«Как потребность доходит до
# сбора»). Пока потребность не объявлена, стратегия не торгует: её условия
# адресуются идентичностями вычисления, а их выдаёт владелец на требование.
# Направление калибровки — ЧАЩЕ, чем реже: в установившемся состоянии
# проход пуст и стоит одного запроса.
strategy-demand:
  enabled: true
  cron: ${STRATEGY_DEMAND_CRON:0 */2 * * * *}

# Сборка контекста прохода (docs/components/DealContextService.md).
# Потолок выборки строк разбивки движений на одну сделку — единственная
# коллекция контекста, чья мощность не задана конструкцией сделки.
# Упёршаяся в потолок выборка означает НЕПОЛНОТУ: расчёт запрещается, а не
# считается по усечённому множеству.
deal-context:
  cash-flow-window-limit: ${DEAL_CASH_FLOW_WINDOW_LIMIT:500}
  # Толерантность прохода к возрасту снимка средств: старше — обработчик
  # заказывает добычу и на этой итерации ни преконтроля, ни создания
  # заявки не запускает. Величина операционная (срок годности операнда),
  # а не потолок риска.
  balance-freshness: ${DEAL_BALANCE_FRESHNESS:2m}

# Отбор входа (docs/components/EntryScannerJob.md): ищет возможность
# создать сделку и создаёт ТОЛЬКО сделку. Период — калибровочное число:
# тик читает рыночные операнды у владельца, поэтому «чаще» стоит его
# поверхности, а «реже» — пропущенного входа. Окно выборки инструментов
# обязано быть шире каталога контура: у́же — молчаливый пропуск входов.
entry-scanner:
  enabled: ${ENTRY_SCANNER_ENABLED:true}
  cron: ${ENTRY_SCANNER_CRON:0 * * * * *}
  instrument-window: ${ENTRY_SCANNER_INSTRUMENT_WINDOW:200}

# Проход сопровождения сделок (docs/components/DealOrchestratorJob.md).
# Период — калибровочное число: проход сам по себе локален, а его цена —
# вызовы к площадке, которые он породит. Окно выборки ограничивает число
# сделок за тик; не попавшие в окно подбираются следующим — порядок
# выборки детерминирован идентификатором.
deal-orchestrator:
  enabled: ${DEAL_ORCHESTRATOR_ENABLED:true}
  cron: ${DEAL_ORCHESTRATOR_CRON:0 * * * * *}
  batch-size: ${DEAL_ORCHESTRATOR_BATCH_SIZE:100}

# Реле outbox (docs/components/OutboxRelayJob.md): публикует накопленное и
# помечает опубликованное. Период — калибровочное число с названным
# направлением: ЧАЩЕ, чем реже — задержка публикации есть задержка
# наблюдаемости, а пустой проход стои́т одного запроса к своей базе.
outbox-relay:
  enabled: ${OUTBOX_RELAY_ENABLED:true}
  cron: ${OUTBOX_RELAY_CRON:*/15 * * * * *}
  batch-size: ${OUTBOX_RELAY_BATCH_SIZE:200}

# Проактивная детекция (docs/components/AnomalyJob.md): ищет нарушения
# инвариантов, сравнивая живые факты биржи с нашими строками. Такт — тик
# джобы; собственного расписания детекторы не имеют. Числа ниже —
# калибровка НАБЛЮДЕНИЯ, не риск-аппетит: их ошибка меряется парой
# «ложное срабатывание против пропуска». Отгружаются провизорными.
anomaly-job:
  enabled: ${ANOMALY_JOB_ENABLED:true}
  cron: ${ANOMALY_JOB_CRON:30 * * * * *}
  # Сколько подряд идущих НЕнаблюдённых проходов поднимают мягкую счётную
  # ступень. Единица сделала бы одиночный упор в лимит частоты основанием
  # остановки набора со снятием вручную.
  blind-pass-limit: ${ANOMALY_BLIND_PASS_LIMIT:3}
  # Минимальный возраст стоящей строки, при котором она читается
  # подтверждением признака. Верхняя граница окна обязательна: без неё
  # подтверждением служит строка, заведённая смежным проходом секундами
  # раньше, а гонка чтения, против которой гистерезис заведён, живёт такт.
  confirmation-min-age: ${ANOMALY_CONFIRMATION_MIN_AGE:30s}
  # Окно выборки контура за проход; упор в него засчитывается неполнотой
  # прохода — тем же ходом, что и неполученный срез.
  contour-window: ${ANOMALY_CONTOUR_WINDOW:500}

# Политика повтора команд (docs/components/RetryPolicyService.md).
# АВТОРИТЕТ ПРЕДЕЛА — здесь, а не снимок на строке исполнения: предел
# повторов — операционная крутилка, и правка обязана браться сразу везде.
# Переопределения по типу команды заводятся по потребности, не
# превентивно: секции `policies` тут нет, пока ни одна команда не
# затребовала своей.
service-command-retry:
  default-policy:
    max-attempts: 3
    initial-delay: 5s
    max-delay: 2m
    backoff: EXPONENTIAL

# Журнал происшествий (docs/models/domain/other/AnomalyReport.md).
# Окно наблюдения — операнд дедупа факта-СОСТОЯНИЯ: пока строка по ключу
# заведена не раньше этого срока, состояние читается как держащееся, и
# вторая строка не заводится. Носителя «последнее наблюдение» в модели
# нет намеренно, поэтому окно и есть его замена.
anomaly-report:
  observation-window: ${ANOMALY_OBSERVATION_WINDOW:1h}

# Три числа допуска сверки P&L (docs/rules/pnl-reconciliation.md §Допуск).
# Числа ОБЩИЕ, не на площадку: на площадку задаётся только режим, в котором
# они применяются. Отгружаются некалиброванными — до калибровки держателем
# расхождение сверх них лестницу не триггерит, потому что неотличимо от
# «допуск не тот».
pnl-reconciliation:
  relative-share: ${PNL_TOLERANCE_RELATIVE_SHARE:0.0005}
  omission-multiplier: ${PNL_TOLERANCE_OMISSION_MULTIPLIER:1.5}
  floor: ${PNL_TOLERANCE_FLOOR:0.05}

# Аварийное снятие живого риска (docs/components/KillSwitchExecutor.md).
# Предел попыток ОГРАНИЧЕН намеренно: его исчерпание — штатный отказ, после
# которого радиус остаётся в жёсткой ступени с незакрытым отчётом, а
# продолжение одно и оно названо — доведение по вызову держателя.
# Неограниченный повтор слал бы рыночные закрытия каждым тиком.
kill-switch:
  max-teardown-attempts: ${KILL_SWITCH_MAX_TEARDOWN_ATTEMPTS:3}

# Контур площадки: значения на площадку целиком, ключ — её код
# (docs/models/domain/core/Exchange.md §«Настройки контура биржи»).
# Отображение «сырой тип[/подтип] → категория движения» наблюдением НЕ
# подтверждено целиком и пополняется держателем по наблюдённому перечню:
# тип вне отображения садится в принимающую корзину и заводит журнальный
# отчёт — разведочное состояние видно в данных, а не подразумевается
# (docs/models/mapping/DealCashFlow.md §«Резолв категории»).
exchange-contour:
  exchanges:
    OKX:
      cash-flow-category-mapping:
        "2": REALIZED_PNL
        "8": FUNDING
        "9": REALIZED_PNL
        "5/100": REALIZED_PNL
        "5/101": REALIZED_PNL
        "5/102": REALIZED_PNL
        "5/103": REALIZED_PNL
        "5/104": REALIZED_PNL
        "5/105": REALIZED_PNL
        "5/106": REALIZED_PNL
        "5/107": REALIZED_PNL
        "5/116": LIQ_PENALTY
      # Выведены из области сверки, будучи покрытыми отображением
      # (docs/integrations/okx/rules/cash-flow-categories.md §«Типы вне
      # экономики сделки»).
      reconciliation-exclusions:
        - "2/407"
        - "2/408"
        - "2/410"
        - "2/411"
        - "2/412"
        - "2/413"
      # Глубина свежего эндпоинта движений (контракт account-bills): по ней
      # конвейер решает, звать ли архив.
      bills-fresh-depth-days: 7
      # Глубина архива движений: операнд признака полноты разбивки — окно
      # добычи, уходящее глубже архива, накрыть жизнь сделки не могло.
      bills-archive-depth-days: 90
      # Режим допуска сверки: разведочный, пока держатель не откалибровал
      # три числа выше по фактическим расхождениям. В нём расхождение даёт
      # признак и отчёт, но лестницу не триггерит.
      reconciliation-exploratory: ${PNL_RECONCILIATION_EXPLORATORY:true}

management:
  endpoints:
    web:
      exposure:
        include: health
