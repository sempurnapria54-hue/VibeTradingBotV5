# Конфигурация сервиса audit-statistics.
#
# Значения осей окружения приезжают из манифеста окружения
# (deploy/<окружение>/env.yaml); здесь — только форма и умолчания,
# выбранные так, чтобы незаданное означало ОТКАЗ, а не разрешение.
spring:
  application:
    name: audit-statistics
  # РАЗМЕР ПУЛА ПЛАНИРОВЩИКА — величина, ВЫВЕДЕННАЯ ИЗ ЧИСЛА @Scheduled-методов
  # сервиса, а не калибруемая окружением: сколько у сервиса джоб, знает его
  # дерево, а не манифест, и плейсхолдер здесь был бы приглашением разойтись.
  # Умолчание каркаса — ОДИН поток на все джобы, а среди них есть ИЗМЕРИТЕЛЬ:
  # тик состояния приёма — единственный писатель и durable-момента живости, и
  # рядов экспорта, и его голодание неотличимо от мёртвого приёма у того, кто
  # смотрит на алерт (.claude/rules/codestyle.md §Джобы, клауза «Операнда
  # живости мало: такт обязан ДОСТАТЬСЯ тику»). Счёт сверяет проба, а не глаз:
  # SchedulerCapacityTest считает @Scheduled-методы дерева и роняет сборку,
  # если джоб стало больше, чем потоков.
  task:
    scheduling:
      pool:
        size: 3
  security:
    oauth2:
      resourceserver:
        jwt:
          # Точка провайдера идентичности: по ней сервис забирает ключи и
          # проверяет подпись токена ЛОКАЛЬНО, без вызова auth на каждом
          # запросе (docs/architecture/contracts.md §«Контекст тенанта в
          # вызове»). Пустое означает, что контур доступа не настроен, и
          # контекст не поднимется — это отказ, а не открытая поверхность.
          issuer-uri: ${OIDC_ISSUER_URI:}

# Подключения к базам владельцев данных. Форма своя, а не spring.datasource:
# у процесса ДВА владельца и три подключения, и одиночная настройка Boot их
# не выражает (docs/architecture/data-ownership.md §Раскладка).
#
# ТРЕТЬЕГО БЛОКА ЗДЕСЬ НЕТ: журнал модуль статистики читает под СВОЕЙ ролью,
# и это подключение собирается из двух объявленных — адрес журнала плюс
# учётные данные агрегатов (PersistenceConfig). Отдельный адрес разошёлся бы
# с адресом журнала молча.
audit-statistics:
  persistence:
    journal:
      url: ${AUDIT_DB_URL:}
      username: ${AUDIT_DB_USERNAME:}
      password: ${AUDIT_DB_PASSWORD:}
      # РАЗМЕР ПУЛА — величина конфигурации, а не умолчание библиотеки:
      # подключения собираются явно, и spring.datasource.hikari.* этими бинами
      # не читается. Дефолт вдвое меньше умолчания Hikari — процесс не
      # параллелит работу шире (один слушатель, один планировщик, один
      # читатель), а подключений у него три.
      max-pool-size: ${AUDIT_DB_MAX_POOL_SIZE:5}
    aggregates:
      url: ${STATISTICS_DB_URL:}
      username: ${STATISTICS_DB_USERNAME:}
      password: ${STATISTICS_DB_PASSWORD:}
      max-pool-size: ${STATISTICS_DB_MAX_POOL_SIZE:5}
    # ПУЛ КРОСС-ПОДКЛЮЧЕНИЯ — скаляром, а не третьим комплектом: адреса и
    # учётных данных своих у него нет намеренно, а пул — собственный ресурс
    # реплики и калибруется отдельно от обоих владельцев.
    journal-read-max-pool-size: ${JOURNAL_READ_MAX_POOL_SIZE:5}

# Подписка группы журнала. Форма своя, а не spring.kafka.*: автоконфигурации
# Kafka в дереве зависимостей нет — Boot 4 разнёс её по модулям
# spring-boot-<технология>, и spring-kafka сам по себе ничего не настраивает.
# Клиент брокера объявлен явно (ReceptionKafkaConfig), поэтому свойства
# spring.kafka.* здесь выглядели бы настройкой и ею не были бы.
reception:
  # Пустое означает, что тропа приёма не настроена: контейнер не поднимется.
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
  # Имя группы — операнд durable-строки состояния приёма, а не свойство
  # транспорта: ключ строки есть пара «группа × тема»
  # (docs/models/domain/other/AuditRecord.md).
  group-id: ${RECEPTION_GROUP_ID:audit-statistics.journal}
  # ТЕМА КАЖДОГО ПРОИЗВОДИТЕЛЯ несомых классов, а не одна
  # (docs/components/AuditEventListener.md). Тем auth здесь нет: производителя
  # у его классов не построено (.claude/work/backlog.md §«События auth —
  # производителя и темы нет»).
  # ФОРМА ЗНАЧЕНИЯ — СКАЛЯР ЧЕРЕЗ ЗАПЯТУЮ, а не перечень YAML: разбирает его
  # выражение самого слушателя, и одиночным плейсхолдером перечень не
  # разрешается. Читатель у ключа один, поля в ReceptionProperties под него нет.
  topics: ${RECEPTION_TOPICS:trading-core.facts,strategies.facts}
  # Пауза между повторами отравленного сообщения. Числа попыток рядом нет и
  # не будет: обработчик группы журнала идёт БЕЗ их ограничения.
  retry-interval: ${RECEPTION_RETRY_INTERVAL:5s}
  # Выключатель тика состояния приёма — как у всякой джобы. При снятом
  # строк состояния не заводит никто, и предикат непрерывности отвечает
  # «не утверждаема» (docs/spec/audit-journal.json, pairsObserved).
  state-tick-enabled: ${RECEPTION_STATE_TICK_ENABLED:true}
  # Такт тика. Калибруется в паре с допустимым возрастом строки состояния
  # (receptionStateMaxAgeMs): порог обязан быть заметно больше такта и
  # заметно меньше срока, за который дыра становится потерей
  # (docs/components/ReceptionStateJob.md).
  state-tick-interval: ${RECEPTION_STATE_TICK_INTERVAL:30s}
  # ДОПУСТИМЫЙ ВОЗРАСТ СТРОКИ СОСТОЯНИЯ — третий конъюнкт попарного
  # предиката непрерывности (docs/spec/audit-journal.json,
  # receptionStateMaxAgeMs), а не настройка отчётности: измеритель, не
  # проверяющий живость наблюдаемого, мерит собственные часы. Калибруется
  # в паре с тактом выше: заметно больше такта и заметно меньше срока, за
  # который дыра становится потерей.
  state-max-age: ${RECEPTION_STATE_MAX_AGE:5m}
  # Доля срока хранения темы, из которой выводится порог алерта на лаг
  # пары. ВЕЛИЧИНА КОНФИГУРАЦИИ СЕРВИСА, а не константа кода и не литерал
  # исполнимой формы: назначенная внутри исполнителя, она перестала бы быть
  # калибруемой (docs/architecture/data-ownership.md §«Outbox и доставка»).
  # Дефолт — половина: половина оставляет на реакцию столько же времени,
  # сколько ушло на накопление. Сам срок здесь НЕ хранится — его добывает у
  # брокера тик, и носитель числа остаётся один.
  lag-alert-threshold-fraction: ${RECEPTION_LAG_ALERT_THRESHOLD_FRACTION:0.5}

# Чистка журнала в непроизводственном окружении. ПРИМЕНИМОСТЬ ЗДЕСЬ НЕ
# ЛЕЖИТ: её несёт ось окружения journalRetentionProfile ниже — в prod у
# прохода нет предмета вовсе (docs/components/JournalCleanupJob.md).
jobs:
  journal-cleanup:
    enabled: ${JOB_JOURNAL_CLEANUP_ENABLED:true}
    # Раз в сутки: проход удаляет всё, что вышло за глубину, и догонять ему
    # нечего — пропущенный такт невыполненной работы не оставляет.
    cron: ${JOB_JOURNAL_CLEANUP_CRON:0 30 3 * * *}
    # ГЛУБИНА ХРАНЕНИЯ В СУТКАХ — величина конфигурации сервиса, а не число
    # оси: ось несёт ПРОФИЛЬ, а глубина назначается
    # (docs/models/domain/other/AuditRecord.md §«Глубина хранения»).
    # Отсчёт — по моменту ПРИЁМА строки: на этом стои́т отбор пересчёта
    # агрегатов. Дефолт кладёт этот шаг, калибрует владелец журнала по
    # наблюдаемому объёму; направление консервативности — в сторону
    # большей глубины, потому что удаление необратимо. Размера порции
    # рядом нет: исход прохода от неё не зависит, и она константа кода.
    depth-days: ${JOB_JOURNAL_CLEANUP_DEPTH_DAYS:30}
  # Пересчёт агрегатов статистики из журнала. Строка агрегата — ПРОЕКЦИЯ, а
  # не накопитель: она пересчитывается целиком и событием не двигается
  # (docs/rules/statistics-aggregates.md §«Пересчёт — проекция, а не
  # накопитель»). Отсюда и отсутствие отметки последнего пересчёта: она
  # выглядела бы дешевле окна и теряла бы строку, зафиксированную позже
  # своего момента, — молча.
  aggregate-recompute:
    enabled: ${JOB_AGGREGATE_RECOMPUTE_ENABLED:true}
    # Раз в час: строки читает человек, и лаг проекции в час он видит
    # моментом сборки, который выдача отдаёт вместе с числами.
    cron: ${JOB_AGGREGATE_RECOMPUTE_CRON:0 10 * * * *}
    # ЧИСЛО СУТОК ОКНА — СВОЯ величина конфигурации сервиса, а не копия
    # пределов выдачи: те ограничивают запрошенное ЧИТАТЕЛЕМ и
    # консервативны в сторону меньшего окна, эта назначает объём
    # собственной работы прохода и консервативна в сторону БОЛЬШЕГО.
    # «Полный пересчёт» — её значение, а не вторая джоба: окно шире
    # прожитого журналом времени накрывает его целиком. Дефолт кладёт этот
    # шаг, калибрует владелец агрегатов по наблюдённому опозданию событий.
    window-days: ${JOB_AGGREGATE_RECOMPUTE_WINDOW_DAYS:7}

# Ограничения выборок чтения. ПРЕДЕЛОВ ШИРИНЫ ОКНА У СЕРВИСА ДВА, и здесь
# лежит журнальный: он меряется моментом происшествия, а агрегатный —
# сутками зерна, и одним числом они не выражаются
# (docs/models/domain/other/AuditRecord.md §«Как журнал читается»).
# Направление консервативности — в сторону МЕНЬШЕГО окна: узкое обратимо
# читателем (он добирает страницами), широкое необратимо для соседей по
# процессу — тяжёлый скан идёт по таблице, которая в prod не чистится.
surface:
  journal-read:
    max-window: ${SURFACE_JOURNAL_MAX_WINDOW:7d}
    page-size: ${SURFACE_JOURNAL_PAGE_SIZE:200}
  # Ограничения АГРЕГАТНОЙ выборки. Предел здесь свой и меряется СУТКАМИ
  # ЗЕРНА — включающим их числом, — а не моментом происшествия
  # (docs/rules/statistics-aggregates.md §«Что это за числа и кто их
  # читает»). Якорь дефолта — квартал: период, за который держатель
  # сравнивает определения стратегий между собой. Число заметно больше
  # журнального не по разнобою: у агрегата строка на зерно в сутки, у
  # журнала — строка на событие.
  aggregate-read:
    max-window-days: ${SURFACE_AGGREGATE_MAX_WINDOW_DAYS:92}
    page-size: ${SURFACE_AGGREGATE_PAGE_SIZE:200}

platform:
  environment:
    name: ${PLATFORM_ENVIRONMENT:}
    # Профиль хранения журнала: ось окружения, доезжающая до исполнителя
    # чистки ключом манифеста сервиса
    # (docs/models/domain/other/AuditRecord.md §«Глубина хранения»).
    # Пусто = ось не доехала; что делает на этом чистка — предмет её дома
    # (docs/components/JournalCleanupJob.md), а не этого умолчания.
    journal-retention-profile: ${PLATFORM_JOURNAL_RETENTION_PROFILE:}

# Экспозиция actuator. ПЕРЕЧЕНЬ, А НЕ ЗВЁЗДОЧКА: умолчание закрыто, и
# открывается ровно то, у чего есть названный спрашивающий
# (docs/rules/api-access-policy.md §«Вся поверхность закрыта; открытое —
# перечислено»). Проба живости — развёртывание; съём метрик — наблюдатель
# окружения (ServiceMonitor манифеста сервиса).
#
# БЕЗ ЭТОЙ СТРОКИ РЕЕСТР МЕТРИК РАБОТАЕТ, А ЭНДПОИНТА НЕТ, и отказа при
# этом тоже нет: наблюдатель получает 404, ряды не собираются, оба правила
# алерта молчат. Ряды и правило заведены — конфигурация обязана их выпустить.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
