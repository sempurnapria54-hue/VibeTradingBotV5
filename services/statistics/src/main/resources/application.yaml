# Конфигурация сервиса statistics.
#
# Значения осей окружения приезжают из манифеста окружения
# (deploy/<окружение>/env.yaml); здесь — только форма и умолчания,
# выбранные так, чтобы незаданное означало ОТКАЗ, а не разрешение.
spring:
  application:
    name: statistics
  # РАЗМЕР ПУЛА ПЛАНИРОВЩИКА — величина, ВЫВЕДЕННАЯ ИЗ ЧИСЛА @Scheduled-методов
  # сервиса, а не калибруемая окружением: сколько у сервиса джоб, знает его
  # дерево, а не манифест, и плейсхолдер здесь был бы приглашением разойтись.
  # Умолчание каркаса — ОДИН поток на все джобы, а среди них есть ИЗМЕРИТЕЛЬ:
  # тик состояния приёма — единственный писатель и durable-момента живости, и
  # рядов экспорта, и его голодание неотличимо от мёртвого приёма у того, кто
  # смотрит на алерт (.claude/rules/codestyle.md §Джобы, клауза «Операнда
  # живости мало: такт обязан ДОСТАТЬСЯ тику»). Счёт сверяет проба, а не глаз:
  # SchedulerCapacityTest считает @Scheduled-методы дерева и роняет сборку,
  # если джоб стало больше, чем потоков.
  task:
    scheduling:
      pool:
        size: 2
  security:
    oauth2:
      resourceserver:
        jwt:
          # Точка провайдера идентичности: по ней сервис забирает ключи и
          # проверяет подпись токена ЛОКАЛЬНО, без вызова auth на каждом
          # запросе (docs/architecture/contracts.md §«Контекст тенанта в
          # вызове»). Пустое означает, что контур доступа не настроен, и
          # контекст не поднимется — это отказ, а не открытая поверхность.
          issuer-uri: ${OIDC_ISSUER_URI:}

# Подключение к базе владельца данных. Форма своя, а не spring.datasource:
# на ней стои́т имя менеджера транзакций, которое проверяют пробы границ
# записи (PersistenceConfig). Владелец у процесса один — факты и агрегаты
# суть два предмета одного владельца, и чужого подключения конструкция не
# оставляет ни одного (.claude/decisions/audit-statistics-split.md).
statistics:
  persistence:
    url: ${STATISTICS_DB_URL:}
    username: ${STATISTICS_DB_USERNAME:}
    password: ${STATISTICS_DB_PASSWORD:}
    # РАЗМЕР ПУЛА — величина конфигурации, а не умолчание библиотеки:
    # подключение собирается явно, и spring.datasource.hikari.* этим бином
    # не читается. Процесс не параллелит работу шире одного слушателя,
    # одного планировщика и одного читателя.
    max-pool-size: ${STATISTICS_DB_MAX_POOL_SIZE:5}

# Подписка группы статистики. Форма своя, а не spring.kafka.*:
# автоконфигурации Kafka в дереве зависимостей нет — Boot 4 разнёс её по
# модулям spring-boot-<технология>, и spring-kafka сам по себе ничего не
# настраивает. Клиент брокера объявлен явно (ReceptionKafkaConfig).
reception:
  # Пустое означает, что тропа приёма не настроена: контейнер не поднимется.
  bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:}
  # ГРУППА СВОЯ, А НЕ ЖУРНАЛЬНАЯ, и это несущее: вторая сторона, читающая ту
  # же тему, обязана иметь собственное смещение — иначе одна из двух получит
  # часть темы непрочитанной, и ни один признак об этом не скажет
  # (docs/models/domain/other/StatisticsFact.md §«Подписка, группа и позиция
  # чтения»). Имя группы — операнд durable-строки состояния приёма: ключ
  # строки есть пара «группа × тема».
  group-id: ${RECEPTION_GROUP_ID:statistics.facts}
  # ТЕМА КАЖДОГО ПРОИЗВОДИТЕЛЯ несомых классов. Перечень производен от
  # зёрен: сегодня операнды объявленных зёрен несут только классы ядра, и
  # тема у них одна. Тема strategies здесь не стои́т — ни один её класс
  # операнда зерна не несёт (там же, §«Признак несомого класса»).
  # ФОРМА ЗНАЧЕНИЯ — СКАЛЯР ЧЕРЕЗ ЗАПЯТУЮ, а не перечень YAML: разбирает его
  # выражение самого слушателя, и одиночным плейсхолдером перечень не
  # разрешается.
  topics: ${RECEPTION_TOPICS:trading-core.facts}
  # Пауза между повторами отравленного сообщения. Числа попыток рядом нет и
  # не будет: обработчик идёт БЕЗ их ограничения — потерянный факт не
  # восстанавливается ничем.
  retry-interval: ${RECEPTION_RETRY_INTERVAL:5s}
  # Выключатель тика состояния приёма — как у всякой джобы. При снятом
  # строк состояния не заводит никто, и предикат непрерывности отвечает
  # «не утверждаема».
  state-tick-enabled: ${RECEPTION_STATE_TICK_ENABLED:true}
  # Такт тика. Калибруется в паре с допустимым возрастом строки состояния:
  # порог обязан быть заметно больше такта и заметно меньше срока, за
  # который дыра становится потерей (docs/components/ReceptionStateJob.md).
  state-tick-interval: ${RECEPTION_STATE_TICK_INTERVAL:30s}
  # ДОПУСТИМЫЙ ВОЗРАСТ СТРОКИ СОСТОЯНИЯ — третий конъюнкт попарного
  # предиката непрерывности (docs/spec/durable-reception.json,
  # receptionStateMaxAgeMs), а не настройка отчётности: измеритель, не
  # проверяющий живость наблюдаемого, мерит собственные часы.
  state-max-age: ${RECEPTION_STATE_MAX_AGE:5m}
  # Доля срока хранения темы, из которой выводится порог алерта на лаг
  # пары. ВЕЛИЧИНА КОНФИГУРАЦИИ СЕРВИСА, а не константа кода и не литерал
  # исполнимой формы. Дефолт — половина: половина оставляет на реакцию
  # столько же времени, сколько ушло на накопление. Сам срок здесь НЕ
  # хранится — его добывает у брокера тик, и носитель числа остаётся один.
  lag-alert-threshold-fraction: ${RECEPTION_LAG_ALERT_THRESHOLD_FRACTION:0.5}

jobs:
  # Пересчёт агрегатов из СВОИХ фактов. Строка агрегата — ПРОЕКЦИЯ, а не
  # накопитель: она пересчитывается целиком и событием не двигается
  # (docs/rules/statistics-aggregates.md §«Пересчёт — проекция, а не
  # накопитель»). Отсюда и отсутствие отметки последнего пересчёта: она
  # выглядела бы дешевле окна и теряла бы строку, зафиксированную позже
  # своего момента, — молча.
  aggregate-recompute:
    enabled: ${JOB_AGGREGATE_RECOMPUTE_ENABLED:true}
    # Раз в час: строки читает человек, и лаг проекции в час он видит
    # моментом сборки, который выдача отдаёт вместе с числами.
    cron: ${JOB_AGGREGATE_RECOMPUTE_CRON:0 10 * * * *}
    # ЧИСЛО СУТОК ОКНА — СВОЯ величина конфигурации сервиса, а не копия
    # пределов выдачи: те ограничивают запрошенное ЧИТАТЕЛЕМ и
    # консервативны в сторону меньшего окна, эта назначает объём
    # собственной работы прохода и консервативна в сторону БОЛЬШЕГО.
    # «Полный пересчёт» — её значение, а не вторая джоба: окно шире
    # прожитого рядом фактов времени накрывает его целиком. Дефолт кладёт
    # этот шаг, калибрует владелец по наблюдённому опозданию событий.
    window-days: ${JOB_AGGREGATE_RECOMPUTE_WINDOW_DAYS:7}

# Ограничения агрегатной выборки чтения. Предел меряется СУТКАМИ ЗЕРНА —
# включающим их числом, — а не моментом происшествия
# (docs/rules/statistics-aggregates.md §«Что это за числа и кто их
# читает»). Якорь дефолта — квартал: период, за который держатель
# сравнивает определения стратегий между собой. Направление
# консервативности — в сторону МЕНЬШЕГО окна: узкое обратимо читателем (он
# добирает страницами), широкое необратимо для соседей по процессу.
surface:
  aggregate-read:
    max-window-days: ${SURFACE_AGGREGATE_MAX_WINDOW_DAYS:92}
    page-size: ${SURFACE_AGGREGATE_PAGE_SIZE:200}

platform:
  environment:
    name: ${PLATFORM_ENVIRONMENT:}

# Экспозиция actuator. ПЕРЕЧЕНЬ, А НЕ ЗВЁЗДОЧКА: умолчание закрыто, и
# открывается ровно то, у чего есть названный спрашивающий
# (docs/rules/api-access-policy.md §«Вся поверхность закрыта; открытое —
# перечислено»). Проба живости — развёртывание; съём метрик — наблюдатель
# окружения (ServiceMonitor манифеста сервиса).
#
# БЕЗ ЭТОЙ СТРОКИ РЕЕСТР МЕТРИК РАБОТАЕТ, А ЭНДПОИНТА НЕТ, и отказа при
# этом тоже нет: наблюдатель получает 404, ряды не собираются, оба правила
# алерта молчат.
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
