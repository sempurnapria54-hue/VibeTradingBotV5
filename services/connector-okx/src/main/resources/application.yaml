# Конфигурация сервиса connector-okx.
#
# Значения осей окружения приезжают из манифеста окружения
# (deploy/<окружение>/env.yaml); здесь — только форма и умолчания,
# выбранные так, чтобы незаданное означало ОТКАЗ, а не разрешение.
spring:
  application:
    name: connector-okx
  security:
    oauth2:
      resourceserver:
        jwt:
          # Точка провайдера идентичности: подпись токена проверяется
          # локально по его ключам. Пустое означает, что контур доступа
          # не настроен, и поверхность не поднимется — это отказ.
          issuer-uri: ${OIDC_ISSUER_URI:}
  cloud:
    vault:
      # Адрес хранилища секретов: по нему читаются ключи биржевых счетов
      # (docs/architecture/tenant-and-exchange.md §Ключи).
      uri: ${VAULT_URI:}
      authentication: ${VAULT_AUTHENTICATION:KUBERNETES}
      kubernetes:
        role: ${VAULT_ROLE:}
      kv:
        # Config-import выключен намеренно: коннектор не читает из Vault
        # свойств процесса. Ключи — операнд вызова, и берутся VaultTemplate
        # по адресу счёта, а не биндингом в конфигурацию.
        enabled: false

platform:
  environment:
    # Первый сегмент адреса ключей счёта. Пусто = адрес невычислим, и
    # приватный вызов отказывает: лучше отказ, чем поход за ключами в
    # чужое окружение.
    name: ${PLATFORM_ENVIRONMENT:}

okx:
  # Базовый URL площадки: выбирается по региону
  # (docs/integrations/okx/contracts/service-urls.md).
  base-url: ${OKX_BASE_URL:}

credentials:
  # Короткий срок кэша ключей. Требование дома
  # (docs/architecture/tenant-and-exchange.md §Ключи): без кэша каждая
  # команда площадке ходила бы в хранилище, и его недоступность
  # останавливала бы торговлю мгновенно. Ноль выключает кэш.
  cache-ttl: ${CREDENTIALS_CACHE_TTL:60s}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Группы проб развёртывания: живость — /actuator/health/liveness,
      # готовность — /actuator/health/readiness. Обе — подпути открытого
      # исключения /actuator/health/** (docs/rules/api-access-policy.md), и
      # экспозиции сверх `health` им не нужно. Флаг включён в Boot 4
      # умолчанием; объявлен здесь, потому что манифест
      # (deploy/base/services/connector-okx.yaml) опирается на пути групп, а
      # умолчание у флага уже менялось между линиями Boot.
      #
      # СОСТАВ ОБЕИХ ГРУПП — УМОЛЧАНИЕ, состояние самого процесса
      # (`livenessState`, `readinessState`), и внешних зависимостей в них нет
      # намеренно. Живость с хранилищем убивала бы под за чужую
      # недоступность (при запечатанном Vault — по кругу,
      # .claude/skills/local-stand.md). Готовность с хранилищем снимала бы
      # коннектор с балансировки целиком, тогда как без Vault он ОБСЛУЖИВАЕТ:
      # публичные чтения площадки ключей не требуют, приватные идут из кэша
      # ключей (`credentials.cache-ttl` — он заведён ровно ради переживания
      # недоступности хранилища), а промах кэша отвечает своим классом
      # SECRET_STORE_UNAVAILABLE — «повтор поможет», в отличие от отказа
      # транспорта до самого коннектора. Базы у коннектора нет.
      probes:
        enabled: true
