# Конфигурация сервиса auth.
#
# Значения осей окружения приезжают из манифеста окружения
# (deploy/<окружение>/env.yaml); здесь — только форма и умолчания,
# выбранные так, чтобы незаданное означало ОТКАЗ, а не разрешение.
spring:
  application:
    name: auth
  security:
    oauth2:
      resourceserver:
        jwt:
          # Точка провайдера идентичности: по ней сервис забирает ключи и
          # проверяет подпись токена ЛОКАЛЬНО, без вызова auth на каждом
          # запросе (docs/architecture/contracts.md §«Контекст тенанта в
          # вызове»). Значение приезжает из манифеста окружения; пустое
          # означает, что контур доступа не настроен, и контекст не
          # поднимется — это отказ, а не открытая поверхность.
          issuer-uri: ${OIDC_ISSUER_URI:}
  cloud:
    vault:
      # Хранилище секретов: сюда `auth` ПИШЕТ ключи биржевого счёта при
      # регистрации — единственное место платформы, где ключи пишутся
      # (docs/architecture/tenant-and-exchange.md §Ключи). Пустое = адрес
      # не объявлен, и регистрация счёта отвечает отказом, не дойдя до
      # клиента: умолчание библиотеки (https://localhost:8200) адресом
      # окружения не является. Подъём контекста пустое значение не
      # останавливает — чтения реестра хранилища не касаются.
      uri: ${VAULT_URI:}
      authentication: ${VAULT_AUTHENTICATION:KUBERNETES}
      kubernetes:
        role: ${VAULT_ROLE:}
      kv:
        # Config-import выключен: свойств процесса `auth` из Vault не
        # читает, а пишет секреты счетов через VaultTemplate.
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # Подкаталог имени сервиса, а не корень локации: обход рекурсивный, и на
    # общем classpath корень собрал бы цепочки всех сервисов
    # (.claude/rules/codestyle.md §«Схема БД»).
    locations: classpath:db/migration/auth

platform:
  identity:
    # Публичный клиент браузера у провайдера. Токен, выданный не им,
    # тропу заведения тенанта не проходит: служебная идентичность
    # кластера пользователя не несёт вовсе. Пустое = браузерная тропа не
    # настроена, и резолв отвечает отказом.
    browser-client-id: ${OIDC_BROWSER_CLIENT_ID:}
  environment:
    name: ${PLATFORM_ENVIRONMENT:}
    # Пусто = ни один контур не допущен. Окружение без конфигурации
    # счетов не заводит — это отказ, а не «допустимы все».
    admitted-contours: ${PLATFORM_ADMITTED_CONTOURS:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # Группы проб развёртывания: живость — /actuator/health/liveness,
      # готовность — /actuator/health/readiness. Обе — подпути открытого
      # исключения /actuator/health/** (docs/rules/api-access-policy.md), и
      # экспозиции сверх `health` им не нужно. Флаг включён в Boot 4
      # умолчанием; объявлен здесь, потому что манифест
      # (deploy/base/services/auth.yaml) опирается на пути групп, а
      # умолчание у флага уже менялось между линиями Boot.
      probes:
        enabled: true
      group:
        # ЖИВОСТЬ ГРУППЫ НЕ ОБЪЯВЛЯЕТ и остаётся умолчанием —
        # `livenessState`, состоянием самого процесса. Внешняя
        # зависимость в ней убивала бы под за чужую недоступность: при
        # запечатанном Vault проба ждала хранилище дольше своего таймаута,
        # и kubelet гасил под по кругу (.claude/skills/local-stand.md).
        readiness:
          # Готовность — процесс плюс база: без базы `auth` не отвечает ни
          # на одну операцию поверхности. Хранилища секретов в группе НЕТ
          # намеренно: оно нужно только регистрации счёта и смене ключей,
          # а резолв членств — тропа контекста КАЖДОГО запроса периметра —
          # его не касается. Vault в группе снимал бы под с балансировки
          # целиком, и периметр получал бы «владелец членств недоступен»
          # там, где `auth` отвечает; отказ хранилища поверхность и так
          # выражает своим классом на той операции, которой оно нужно.
          include: readinessState,db
