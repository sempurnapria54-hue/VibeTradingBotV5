# Ресурсные лимиты окружения `dev` — носитель оси `resourceProfile`
# (docs/architecture/platform.md, таблица осей различия окружений): квота
# пространства имён и умолчания контейнера. Решение держателя 2026-10-10.
#
# ЧИСЛА ВЫВЕДЕНЫ ИЗ ЗАМЕРА СТЕНДА 2026-10-10, а не взяты с потолка: сумма
# запросов памяти пространства — около 10 GiB, лимитов — около 15 GiB,
# фактическое потребление — около 8.6 GiB. Запас покрывает выкатку всех
# восьми сервисов разом: на время обновления под живёт дважды (старый и
# новый), это ещё около 3.3 GiB запросов и 8.7 GiB лимитов.
#
# ЛИМИТА CPU НЕТ НАМЕРЕННО — ни в квоте, ни умолчанием. Квота на limits.cpu
# потребовала бы лимит CPU у каждого контейнера, а лимит душит JVM на старте
# (сервисы стартуют десятки секунд при запросе 0.1-0.2 ядра); узлу хватает
# 12 ядер при средней загрузке меньше одного.
#
# УМОЛЧАНИЯ КОНТЕЙНЕРА применяются только к новым подам и только к тем, кто
# своих запросов и лимитов не объявил (Kafka, её оператор сущностей,
# Postgres): лимит памяти 2 GiB покрывает их наблюдённое потребление
# (Kafka — около 1 GiB).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment-resources
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 16Gi
    limits.memory: 32Gi
    pods: "40"
    persistentvolumeclaims: "10"
    requests.storage: 60Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 256Mi
      default:
        memory: 2Gi
      max:
        memory: 4Gi
