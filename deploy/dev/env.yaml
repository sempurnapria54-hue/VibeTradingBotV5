# Оси различия окружения `dev` в машиночитаемом виде — вход манифестов
# сервисов, которые приедут шагами 3-10, и предмет проверки
# tools/deploy-layout-check.py.
#
# Дом перечня осей — docs/architecture/platform.md §«Чем различаются
# окружения»; здесь стоят ЗНАЧЕНИЯ осей этого окружения, а не перечень.
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-axes
data:
  environment: "dev"
  # Допустимые контуры площадки. Исполнимая форма правила —
  # docs/spec/environment-contour.json, величина contourAdmitted;
  # проверку допуска делает auth при регистрации биржевого счёта.
  admittedContours: "DEMO"
  # Имя хоста ингресса. Своё на окружение: иначе три окружения одного
  # кластера снаружи неразличимы.
  ingressHost: "dev.vibetrading.invalid"
  # Синхронизация Argo CD.
  argocdSync: "automated"
  # Префикс путей Vault — сегмент окружения, первый в пути.
  vaultPrefix: "dev"
  # Ресурсные лимиты: назначает тот, кто разворачивает сервис, по
  # наблюдаемому потреблению. Здесь — профиль, не числа.
  resourceProfile: "minimal"
  # Глубина хранения временных рядов: назначает владелец market-data по
  # docs/rules/market-data-retention.md. Здесь — профиль, не числа.
  retentionProfile: "reduced"
