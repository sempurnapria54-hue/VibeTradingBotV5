apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Оверлей окружения `prod`. Держит ТОЛЬКО оси различия, объявленные в
# docs/architecture/platform.md §«Чем различаются окружения». Всё
# остальное — в ../base и здесь не повторяется: вторая копия одинакового
# расходится первой.

namespace: prod

resources:
  - ../base
  - env.yaml

# Место тега образа — единственное на сервис в наборе окружения.
# Тег НЕИЗМЕНЯЕМ и продвигается: собирается один раз на коммит и дальше
# только переезжает из окружения в окружение правкой этого списка
# (docs/architecture/platform.md §Развёртывание). Правит его CI хостинга
# репозитория командой tools/deploy-set-image-tag.sh.
# Список пуст, пока нет ни одного сервиса: сервисы приезжают шагами 3-10.
images: []

patches:
  # Имя хоста ингресса — ось различия окружений
  # (docs/architecture/platform.md §«Чем различаются окружения»).
  # Базовый манифест несёт форму, значение подставляет окружение:
  # без этой правки три окружения одного кластера снаружи неразличимы.
  - target:
      kind: Ingress
      name: perimeter
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: prod.vibetrading.invalid
      - op: replace
        path: /spec/tls/0/hosts/0
        value: prod.vibetrading.invalid
  # Тот же хост — в браузерном клиенте провайдера: адрес возврата и
  # источник запросов обязаны совпасть с ингрессом, иначе тропа токена
  # не замкнётся.
  - target:
      kind: KeycloakRealmImport
      name: vibetrading
    patch: |-
      - op: replace
        path: /spec/realm/clients/0/redirectUris/0
        value: https://prod.vibetrading.invalid/*
      - op: replace
        path: /spec/realm/clients/0/webOrigins/0
        value: https://prod.vibetrading.invalid
  - target:
      kind: Namespace
      name: placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: prod
      - op: replace
        path: /metadata/labels/platform.vibetrading~1environment
        value: prod
  - target:
      kind: Cluster
      name: platform-postgres
    patch: |-
      - op: replace
        path: /spec/instances
        value: 3
  - target:
      kind: Elasticsearch
      name: platform-logs
    patch: |-
      - op: replace
        path: /spec/nodeSets/0/count
        value: 3
  - target:
      kind: Keycloak
      name: platform-identity
    patch: |-
      - op: replace
        path: /spec/instances
        value: 2
