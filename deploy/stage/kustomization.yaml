apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Оверлей окружения `stage`. Держит ТОЛЬКО оси различия, объявленные в
# docs/architecture/platform.md §«Чем различаются окружения». Всё
# остальное — в ../base и здесь не повторяется: вторая копия одинакового
# расходится первой.

namespace: stage

resources:
  - ../base
  - env.yaml

# Место тега образа — единственное на сервис в наборе окружения.
# Тег НЕИЗМЕНЯЕМ и продвигается: собирается один раз на коммит и дальше
# только переезжает из окружения в окружение правкой этого списка
# (docs/architecture/platform.md §Развёртывание). Правит его CI хостинга
# репозитория командой tools/deploy-set-image-tag.sh.
# Строка на сервис появляется, когда его образ ВПЕРВЫЕ продвинут в это
# окружение; до того сервис здесь не назван. Клейма о полноте списка тут
# нет: он описывает продвинутое, а не построенное.
images: []

patches:
  # Имя хоста ингресса — ось различия окружений
  # (docs/architecture/platform.md §«Чем различаются окружения»).
  # Базовый манифест несёт форму, значение подставляет окружение:
  # без этой правки три окружения одного кластера снаружи неразличимы.
  - target:
      kind: Ingress
      name: perimeter
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: stage.vibetrading.invalid
      - op: replace
        path: /spec/tls/0/hosts/0
        value: stage.vibetrading.invalid
  # Тот же хост — в браузерном клиенте провайдера: адрес возврата и
  # источник запросов обязаны совпасть с ингрессом, иначе тропа токена
  # не замкнётся.
  - target:
      kind: KeycloakRealmImport
      name: vibetrading
    patch: |-
      - op: replace
        path: /spec/realm/clients/0/redirectUris/0
        value: https://stage.vibetrading.invalid/*
      - op: replace
        path: /spec/realm/clients/0/webOrigins/0
        value: https://stage.vibetrading.invalid
  - target:
      kind: Namespace
      name: placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: stage
      - op: replace
        path: /metadata/labels/platform.vibetrading~1environment
        value: stage
  # Число узлов Kafka объявляет пул, а не сам кластер: с версии оператора
  # 1.0 полей replicas/storage в Kafka нет (см. шапку базового манифеста).
  - target:
      kind: KafkaNodePool
      name: platform-kafka-nodes
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
  - target:
      kind: Kafka
      name: platform-kafka
    patch: |-
      - op: replace
        path: /spec/kafka/config/default.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/offsets.topic.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.replication.factor
        value: 1
      - op: replace
        path: /spec/kafka/config/transaction.state.log.min.isr
        value: 1
      - op: replace
        path: /spec/kafka/config/min.insync.replicas
        value: 1
