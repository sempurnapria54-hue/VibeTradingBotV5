# Развёртывание периметра (шаг 9 фазы 2) — единственной точки входа
# браузера (docs/architecture/services.md, ярус периметра).
#
# СВОЕЙ БАЗЫ У НЕГО НЕТ, и ресурса Database здесь нет ни одного:
# персистентного состояния периметр не держит, а кэш членств эфемерен
# (docs/architecture/contracts.md §«Состояния периметр не держит —
# persistentного»).
#
# ИНГРЕСС И СЕРТИФИКАТ ПРИЕЗЖАЮТ ЗДЕСЬ, а не шагом платформы: маршрут в
# никуда и сертификат ни на что заводить незачем
# (docs/architecture/platform.md §Безопасность). Исполнитель у него —
# контроллер кластерного слоя (deploy/base/platform/ingress-controller.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bff
---
apiVersion: v1
kind: Service
metadata:
  name: bff
  # МЕТКА У САМОЙ СЛУЖБЫ, А НЕ ТОЛЬКО У ПОДА: наблюдатель выбирает
  # ServiceMonitor'ом именно СЛУЖБУ, и без метки на ней он не нашёл бы
  # цели вовсе — молча (docs/architecture/platform.md §Наблюдаемость).
  labels:
    app.kubernetes.io/name: bff
spec:
  selector:
    app.kubernetes.io/name: bff
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  # Реплика одна, но конструкция от их числа не зависит: у каждой своя
  # группа потребителя, и событие доходит до всех открытых сессий
  # (docs/architecture/contracts.md §«Дедуплицирует клиент…»).
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bff
    spec:
      serviceAccountName: bff
      containers:
        - name: bff
          # Метка `unpromoted` — зарезервированная: сервис, чей тег в
          # окружение не продвинут, не разворачивается
          # (docs/architecture/platform.md §Развёртывание).
          image: registry.invalid/vibetrading/bff:unpromoted
          # Тег неизменяем (docs/architecture/platform.md §Развёртывание),
          # поэтому образ, уже лежащий на узле, — тот самый.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLATFORM_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: environment-axes
                  key: environment
            # Провайдер идентичности. Издатель токена — имя хоста окружения,
            # ключи подписи — внутренний адрес провайдера в том же
            # пространстве имён (docs/architecture/platform.md
            # §Безопасность): наружу за ключами сервис не ходит.
            - name: PLATFORM_INGRESS_HOST
              valueFrom:
                configMapKeyRef:
                  name: environment-axes
                  key: ingressHost
            - name: OIDC_ISSUER_URI
              value: https://$(PLATFORM_INGRESS_HOST)/realms/vibetrading
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI
              value: http://platform-identity-service:8080/realms/vibetrading/protocol/openid-connect/certs
            # Брокер: периметр — потребитель тем, у которых есть
            # производитель. Тем `auth` здесь нет намеренно
            # (.claude/work/backlog.md §«События `auth` — производителя и
            # темы нет»).
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap:9092
            - name: PERIMETER_STREAM_TOPICS
              value: trading-core.facts,strategies.facts
            # Секрет подписи билета подписки — ОБЩИЙ У РЕПЛИК: подписка
            # может прийти не на ту реплику, что выдала билет
            # (docs/architecture/contracts.md §«Подписку открывает билет,
            # а не сам токен»). Значение вне репозитория; в целевой
            # конструкции — Vault.
            - name: PERIMETER_TICKET_SECRET
              valueFrom:
                secretKeyRef:
                  name: bff-ticket-secret
                  key: secret
          # Числа назначает разворачивающий по наблюдаемому потреблению;
          # это ПЕРВОЕ назначение — до наблюдения.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # Пробы смотрят на РАЗНЫЕ группы здоровья, а не на общий
          # /actuator/health: живость мерит только состояние процесса,
          # готовность — процесс (базы у периметра нет). Общее здоровье несёт
          # сверх них индикаторы каркаса, и первый индикатор внешней
          # зависимости вошёл бы в живость молча. Состав групп —
          # services/bff/src/main/resources/application.yaml; раскладка —
          # docs/architecture/platform.md, пункт «Пробы развёртывания».
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
# СЪЁМ МЕТРИК: ряд частоты отказов доступа — половина следа отказа у
# периметра, у которого базы нет (docs/rules/api-access-policy.md §«След
# отказа пишет тот, у кого есть база»); вторая половина — строка лога.
#
# СНАРУЖИ КЛАСТЕРА ЭТОЙ ТОЧКИ НЕТ: ингресс ниже ведёт к периметру только
# префикс внешней поверхности, а путь съёма лежит вне него. Тропу в сети заводить
# не надо — вход из пространства наблюдателя разрешён всем подам общим
# правилом яруса (deploy/base/network-platform-allowances.yaml).
#
# МЕТКА `release` отбирает ресурс оператором чарта наблюдателя — без неё
# ресурс существует, а съёма нет (довод — deploy/base/services/audit.yaml).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bff
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bff
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
# Исходящее периметра. Разрешение даёт таблица
# docs/architecture/contracts.md §«Синхронные вызовы»: строки `bff → auth`,
# `bff → strategies, trading-core, market-data`, `bff → audit` и
# `bff → statistics` (у двух последних — только чтение).
#
# ЭТА ПОЛИТИКА И ЕСТЬ ЭНФОРСЕР НАБОРА ВЛАДЕЛЬЦЕВ: адрес периметр выводит
# из первого сегмента пути и перечня не держит, а пара, которой нет в
# таблице контрактов, в кластере запрещена
# (docs/architecture/platform.md §Безопасность).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bff
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trading-core
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: strategies
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: market-data
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: audit
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: statistics
      ports:
        - protocol: TCP
          port: 8080
    # Брокер — не строка таблицы синхронных вызовов, а тропа к инстансу
    # данных: периметр потребляет темы фактов для потока в браузер. Порт —
    # открытого слушателя кластера Kafka (deploy/base/data/kafka-cluster.yaml),
    # того же, что называет адрес в переменной окружения выше.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: platform-kafka
      ports:
        - protocol: TCP
          port: 9092
---
# Встречные разрешения на стороне владельцев. Запрет по умолчанию
# действует в ОБЕ стороны: одного исходящего правила у периметра мало.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: auth
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trading-core-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trading-core
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: strategies-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: strategies
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: market-data-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: market-data
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: audit
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: statistics-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: statistics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
# Встречное разрешение на стороне брокера — тот же довод, что у владельцев:
# запрет по умолчанию двусторонний, и одного исходящего правила периметра
# мало.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress-from-bff
spec:
  podSelector:
    matchExpressions:
      - key: strimzi.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 9092
---
# Встречное разрешение на стороне провайдера: подпись токена периметр
# проверяет локально, а ключи подписи забирает у провайдера. Исходящего
# правила выше мало — запрет по умолчанию действует в обе стороны.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-ingress-from-bff
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: bff
      ports:
        - protocol: TCP
          port: 8080
---
# Вход от контроллера ингресса — к периметру и к провайдеру, ровно по тем
# маршрутам, которые объявляет Ingress ниже. Контроллер живёт своим
# пространством имён (deploy/base/platform/ingress-controller.yaml), а запрет
# по умолчанию закрывает вход ко всем подам окружения: без этих двух правил
# маршрут доезжал бы до контроллера и обрывался на нём.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: bff-ingress-from-controller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: bff
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-ingress-from-controller
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress
      ports:
        - protocol: TCP
          port: 8080
---
# Ингресс окружения: снаружи трафик приходит по TLS, его терминирует он,
# а сертификат выдаётся автоматически по имени хоста окружения
# (docs/architecture/platform.md §Безопасность). Имя хоста — ось
# различия окружений, и здесь стои́т значение `dev`: наложение окружения
# подменяет его своим.
#
# ХОСТ ОДИН — И СЕРТИФИКАТ ОДИН, поэтому маршрутов у объекта три: поверхность
# периметра, точка выдачи токена провайдера и оформление его страницы входа.
# Два последних не принадлежат периметру, но без них токен человеку снаружи
# взять неоткуда, а страница входа приходит без стилей; отдельный объект с
# тем же хостом потребовал бы второго сертификата на то же имя.
# Наружу ведут только реалм окружения и статика провайдера — ни консоли
# администратора, ни служебного реалма снаружи нет: их страницы и API живут
# под /admin/ и /realms/master, и ни один маршрут корня провайдера не
# называет (docs/architecture/platform.md §Безопасность;
# .claude/decisions/identity-login-resources-route.md).
#
# ФРОНТ ОТДАЁТСЯ ИНГРЕССОМ, А НЕ ПЕРИМЕТРОМ (docs/architecture/services.md,
# строка `web`), поэтому маршрут статики приедет вместе с ним — шагом 13.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: perimeter-issuer
spec:
  # САМОПОДПИСАННЫЙ, и это названный выбор, а не умолчание. Публичного
  # имени у окружения нет (хосты — *.invalid), значит ACME-проверку
  # владения проходить нечем, а корпоративного центра сертификации в
  # контуре не существует. Условие пересмотра то же, что у транспорта
  # внутри кластера: перед первым развёртыванием `prod`
  # (docs/architecture/platform.md §Безопасность,
  # .claude/work/prod-checks.md §«Транспорт внутри кластера — пересмотр перед
  # первым `prod`»).
  selfSigned: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: perimeter
  annotations:
    cert-manager.io/issuer: perimeter-issuer
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - dev.vibetrading.invalid
      secretName: perimeter-tls
  rules:
    - host: dev.vibetrading.invalid
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  name: http
          - path: /realms/vibetrading
            pathType: Prefix
            backend:
              service:
                name: platform-identity-service
                port:
                  number: 8080
          # СТАТИКА ПРОВАЙДЕРА ЦЕЛИКОМ, А НЕ ПО ВЕРСИИ: второй сегмент пути
          # ресурсов — хэш сборки провайдера, он меняется с обновлением
          # оператора, и префикс с ним молча вернул бы страницу входа без
          # стилей. Статика консоли под тем же префиксом ни данных, ни
          # полномочий не несёт — API консоли живёт под /admin/.
          - path: /resources
            pathType: Prefix
            backend:
              service:
                name: platform-identity-service
                port:
                  number: 8080
