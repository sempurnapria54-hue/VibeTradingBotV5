# Развёртывание сервиса statistics — владельца фактов статистики и
# агрегатов над ними (docs/architecture/services/statistics.md).
#
# ПОВЕРХНОСТЬ ТОЛЬКО ЧИТАЮЩАЯ: команд у сервиса нет по инвентарю, и
# входящий вызов у него один — от периметра
# (docs/architecture/contracts.md §«Синхронные вызовы»). Его встречная
# пара объявлена рядом с исходящим правилом вызывающего — в bff.yaml,
# как у остальных владельцев.
#
# БАЗА ОДНА: владелец данных у процесса один. Чужого подключения
# конструкция не оставляет ни одного — журнал аудита источником пересчёта
# не служит (.claude/decisions/audit-statistics-split.md). Роли объявлены
# полем кластера (deploy/base/data/postgres-cluster.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: statistics
---
# База статистики: в ней и факты, и агрегаты — два предмета одного
# владельца (docs/architecture/data-ownership.md §Раскладка).
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: statistics
spec:
  cluster:
    name: platform-postgres
  name: statistics
  owner: statistics
  # Факты лежат гипертаблицами по оси времени своего зерна
  # (docs/models/domain/other/StatisticsFact.md §Персистентность);
  # расширение объявляет тот, кто заводит базу, а не миграция сервиса:
  # `create extension` требует прав суперпользователя, которых у
  # роли-владельца базы нет и быть не должно.
  extensions:
    - name: timescaledb
      ensure: present
---
apiVersion: v1
kind: Service
metadata:
  name: statistics
  # МЕТКА У САМОЙ СЛУЖБЫ, А НЕ ТОЛЬКО У ПОДА: наблюдатель выбирает
  # ServiceMonitor'ом именно СЛУЖБУ, а не под, и без метки на ней он не
  # нашёл бы цели вовсе — молча, потому что «нет целей» неотличимо от
  # «цели здоровы» (docs/architecture/platform.md §Наблюдаемость).
  labels:
    app.kubernetes.io/name: statistics
spec:
  selector:
    app.kubernetes.io/name: statistics
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: statistics
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: statistics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statistics
    spec:
      serviceAccountName: statistics
      containers:
        - name: statistics
          image: registry.invalid/vibetrading/statistics
          # Тег неизменяем (docs/architecture/platform.md §Развёртывание),
          # поэтому образ, уже лежащий на узле, — тот самый.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PLATFORM_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: environment-axes
                  key: environment
            # ОСИ ГЛУБИНЫ ХРАНЕНИЯ ЗДЕСЬ НЕТ, и это не пропуск: глубины у
            # фактов нет ни в одном окружении, а профиль хранения журнала
            # предмета статистики не покидает
            # (docs/models/domain/other/StatisticsFact.md §Персистентность).
            # Провайдер идентичности — сервис того же пространства имён:
            # окружение и есть пространство имён, поэтому адрес не несёт
            # его имени и одинаков во всех трёх.
            - name: OIDC_ISSUER_URI
              value: http://platform-identity-service:8080/realms/vibetrading
            # Брокер: своя durable-группа читает тему каждого производителя
            # несомых классов (docs/models/domain/other/StatisticsFact.md
            # §«Подписка, группа и позиция чтения»). Группа СВОЯ, а не
            # журнальная: у второй стороны своё смещение, иначе одна из
            # двух получила бы часть темы непрочитанной.
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: platform-kafka-kafka-bootstrap:9092
            # ОДИН КОМПЛЕКТ УЧЁТНЫХ ДАННЫХ И ОДНО ПОДКЛЮЧЕНИЕ: факты и
            # агрегаты — два предмета одного владельца, и лежат они в одной
            # базе. Чужого подключения у процесса нет ни одного.
            - name: STATISTICS_DB_URL
              value: jdbc:postgresql://platform-postgres-rw:5432/statistics
            - name: STATISTICS_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-role-statistics
                  key: username
            - name: STATISTICS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-role-statistics
                  key: password
          # Числа назначает разворачивающий по наблюдаемому потреблению
          # (docs/architecture/platform.md §«Чем различаются окружения»).
          # Это ПЕРВОЕ назначение — до наблюдения.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
# Исходящее сервиса. Запрет по умолчанию адресует и его: без правила
# процесс не дойдёт до провайдера идентичности за ключами подписи и не
# поднимет контур доступа вовсе.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: statistics-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: statistics
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    # Своя база сервиса. Политика адресует ПОД и порт, а не роль
    # подключения; чужих подключений у процесса не бывает по построению.
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: platform-postgres
      ports:
        - protocol: TCP
          port: 5432
    # Брокер: своя durable-группа читает темы производителей. Порт —
    # открытого слушателя кластера Kafka, того же, что называет адрес в
    # переменной окружения выше.
    - to:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: platform-kafka
      ports:
        - protocol: TCP
          port: 9092
---
# Встречное разрешение на стороне брокера — тот же довод, что у базы:
# запрет по умолчанию двусторонний.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-ingress-from-statistics
spec:
  podSelector:
    matchExpressions:
      - key: strimzi.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: statistics
      ports:
        - protocol: TCP
          port: 9092
---
# Встречное разрешение на стороне базы. Запрет по умолчанию действует в ОБЕ
# стороны: одного исходящего правила у сервиса мало — без входящего у
# инстанса базы процесс висел бы на попытке соединения (обнаружено первым
# развёртыванием, см. postgres-ingress-from-market-data).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-from-statistics
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: statistics
      ports:
        - protocol: TCP
          port: 5432
---
# СЪЁМ МЕТРИК: наблюдатель окружения приходит к службе за экспозицией
# сервиса (docs/architecture/platform.md §Наблюдаемость).
#
# МЕТКА `release` — НЕ УКРАШЕНИЕ: оператор из чарта kube-prometheus-stack
# отбирает ServiceMonitor и PrometheusRule по метке имени своего релиза
# (умолчание чарта serviceMonitorSelectorNilUsesHelmValues). Без метки
# ресурс существует, а наблюдатель его не берёт — то есть отказ приходит
# МОЛЧАНИЕМ.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: statistics
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: statistics
  endpoints:
    # Порт назван ИМЕНЕМ порта службы, а не числом: число здесь стало бы
    # второй копией того, что уже объявлено выше.
    - port: http
      path: /actuator/prometheus
      interval: 30s
---
# ПРАВИЛ ДВА, И ВМЕСТЕ ОНИ И ЕСТЬ ПРЕДИКАТ ИСПОЛНИМОЙ ФОРМЫ
# (docs/spec/durable-reception.json, pairLagAlertFires) — у ВТОРОГО экземпляра
# формы, а не у первого: свидетельство о полноте производит тот, о чьей
# полноте оно свидетельствует (docs/rules/durable-consumer-reception.md).
# Один ряд на две группы склеил бы их состояния, и здоровый приём журнала
# гасил бы алерт на вставшем приёме статистики.
#
# Первое правило несёт ветвь СРАВНЕНИЯ, второе — ветвь «измеритель не
# мерит». Разнести их пришлось потому, что у наблюдателя пустая величина
# выражается ОТСУТСТВИЕМ РЯДА, а не значением: ряд, поданный числом,
# молча решил бы исход, а поданный NaN — сделал бы ложным всякое
# сравнение, то есть погасил бы алерт тише всех (docs/concept.md, П1).
#
# ЕДИНИЦА ОБОИХ — ПАРА «группа × тема»: метка темы стоит на каждом ряду, и
# свёртка «любая» получается сама — каждая сработавшая пара даёт свой
# экземпляр алерта.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: statistics
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: statistics.reception
      rules:
        - alert: StatisticsReceptionLagging
          # Возраст последнего принятого события достиг порога СВОЕЙ темы,
          # и непринятое по ней есть. Второй конъюнкт несущий: возраст
          # растёт одинаково у вставшего потребителя и у молчащего
          # производителя, а второе штатно — события ядра суть
          # происшествия, и неделя без входов законна.
          expr: |
            statistics_reception_last_event_age_ms
              >= statistics_reception_lag_alert_threshold_ms
            and statistics_reception_unconsumed_records > 0
          labels:
            severity: critical
          annotations:
            summary: "Приём статистики отстаёт на теме {{ $labels.topic }}"
            description: >-
              Возраст последнего принятого события достиг доли срока хранения темы,
              и непринятое в ней есть. Разбирать по строке состояния приёма пары —
              носитель факта запись, а не алерт.
        - alert: StatisticsReceptionUnmeasured
          # Три дизъюнкта, и все три означают «измеритель не мерит»:
          # процесс жив, а рядов приёма не даёт вовсе; у пары нет ряда
          # порога (срок темы не добыт); у пары нет ряда остатка (клиент
          # лага не отдал). Молчание на любом из них равнялось бы снятому
          # алерту, и снял бы его отказ измерения, а не решение.
          expr: |
            up{job="statistics"} == 1
              unless on (namespace, pod) statistics_reception_last_event_age_ms
            or (statistics_reception_last_event_age_ms
              unless statistics_reception_lag_alert_threshold_ms)
            or (statistics_reception_last_event_age_ms
              unless statistics_reception_unconsumed_records)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Измеритель приёма статистики не мерит{{ if $labels.topic }} на теме {{ $labels.topic }}{{ end }}"
            description: >-
              Ряд операнда алерта на лаг пропал или не выводится. Пока он не выводится,
              полнота чисел статистики не наблюдается ничем.
