# Реалм окружения у провайдера идентичности. Владелец — шаг 4 фазы 2
# (`auth`): тенанты, членства и роли ведёт он, а учётные данные, сессии и
# токены — провайдер (docs/architecture/services.md).
#
# ЧТО ЗДЕСЬ ЕСТЬ: структура — сам реалм и клиенты сервисов, ходящих друг к
# другу без пользователя (docs/architecture/contracts.md §«Контекст
# тенанта в вызове»).
#
# ЧЕГО ЗДЕСЬ НЕТ И НЕ БУДЕТ: секретов клиентов. Секрет генерирует сам
# провайдер, а в кластер его переносит команда постановки стенда
# (`.claude/skills/local-stand.md`); в целевой конструкции — Vault
# (docs/architecture/platform.md §Безопасность). Секрет, записанный в
# манифест, лежал бы в git открытым текстом.
#
# УЧЁТНЫХ ЗАПИСЕЙ ЗДЕСЬ НЕТ ТОЖЕ, и по той же причине: пароль субъекта лежал
# бы в git. Учётную запись держателя заводит он сам — на стенде командой
# tools/stand/external-access.sh, в прочих окружениях в консоли
# администратора реалма (docs/rules/api-access-policy.md).
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: vibetrading
spec:
  keycloakCRName: platform-identity
  realm:
    realm: vibetrading
    enabled: true
    # ОПЕРАНД ПОСЫЛКИ «принципал один» (docs/rules/api-access-policy.md
    # §«Принципал один — посылка фазы 1»). Объявлено ЗНАЧЕНИЕМ, а не
    # оставлено умолчанию: до шага 9 фазы 2 токен человеку не выдавался
    # никем, и посылка была неопровержима по построению; браузерная тропа
    # делает её проверяемой. Самозапись, включённая здесь, сделала бы
    # посылку ложной молча — вместе с четырьмя её следствиями, включая
    # отсутствие модели прав. Меняется вместе с фазой 5 (второй субъект).
    registrationAllowed: false
    clients:
      # ПУБЛИЧНЫЙ КЛИЕНТ БРАУЗЕРА (шаг 9 фазы 2). Токен человеку выдаёт
      # только он, и по нему же `auth` отличает токен человека от
      # служебной идентичности кластера — тропу заведения тенанта
      # проходит первый (docs/architecture/contracts.md §«Контекст
      # тенанта в вызове»).
      #
      # Секрета у него нет по построению: код авторизации в браузере
      # хранить негде, поэтому PKCE обязателен, а не желателен.
      #
      # Служебного клиента у периметра НЕТ намеренно: к владельцам он
      # ходит под токеном ПОЛЬЗОВАТЕЛЯ — резолв обязан отвечать про
      # предъявителя, и подставить его может только его же токен.
      - clientId: web
        enabled: true
        protocol: openid-connect
        publicClient: true
        serviceAccountsEnabled: false
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        attributes:
          pkce.code.challenge.method: S256
        redirectUris:
          - "https://dev.vibetrading.invalid/*"
        webOrigins:
          - "https://dev.vibetrading.invalid"
      # СЛУЖЕБНЫЕ КЛИЕНТЫ — по одному на сервис с исходящим синхронным
      # вызовом соседа; имя клиента — имя сервиса, секрет — `oidc-client-<имя>`
      # (конвенция — docs/architecture/platform.md §Безопасность). Команда
      # постановки берёт перечень ОТСЮДА — клиенты с serviceAccountsEnabled:
      # true (tools/stand/identity-client-secret.sh), второй его копии нет.
      #
      # Клиента нет у сервиса, который служебного токена не берёт: периметр
      # ходит под токеном пользователя (выше), коннектор — только к площадке
      # и в Vault, `auth` — только в Vault (оба входят методом Kubernetes),
      # `audit` и `statistics` синхронных вызовов не делают вовсе — только
      # брокер. Появился такой вызов — клиент заводится здесь тем же ходом.
      #
      # Исходящая идентичность market-data: под ней он ходит к коннектору
      # за публичными чтениями площадки. Грант — client credentials:
      # пользователя в этом вызове нет.
      - clientId: market-data
        enabled: true
        protocol: openid-connect
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
      # Исходящая идентичность торгового ядра: под ней оно ходит к
      # коннектору, к auth за реестром счетов и к market-data за фичами.
      - clientId: trading-core
        enabled: true
        protocol: openid-connect
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
      # Исходящая идентичность владельца определений: под ней он читает у
      # ядра числа риск-аппетита и разрешимость ссылок.
      - clientId: strategies
        enabled: true
        protocol: openid-connect
        publicClient: false
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        directAccessGrantsEnabled: false
