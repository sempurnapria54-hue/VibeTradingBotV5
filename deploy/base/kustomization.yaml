apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Общий корень манифестов ОКРУЖЕНИЯ: всё, что одинаково во всех трёх
# окружениях. Различия накладываются оверлеем окружения и ТОЛЬКО по осям
# docs/architecture/platform.md §«Чем различаются окружения».
#
# Пространство имён здесь не задано намеренно: имя пространства — свойство
# окружения, и подставляет его оверлей (namespace: в его kustomization).
#
# Кластерного слоя здесь нет: операторы ставятся раз на кластер и лежат в
# platform/ со своей kustomization (см. её шапку).

resources:
  - namespace.yaml
  - network-default-deny.yaml
  - network-platform-allowances.yaml
  - data/postgres-cluster.yaml
  - data/kafka-cluster.yaml
  - data/vault.yaml
  - data/elastic.yaml
  - data/elastic-ui-and-shipper.yaml
  - data/jaeger.yaml
  - data/keycloak.yaml
  # Сервисы окружения. Форма манифеста одна на все окружения; различаются
  # они только тегом образа (блок images: оверлея).
  - services/identity-realm.yaml
  - services/auth.yaml
  - services/connector-okx.yaml
  - services/market-data.yaml
  - services/trading-core.yaml
