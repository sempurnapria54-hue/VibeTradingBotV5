# Оператор Jaeger. Трейсы с атрибутами tenantId и strategyId на каждом спане.
#
# ВЕРСИЯ ЧАРТА НЕ ЗАКРЕПЛЕНА ПРОГОНОМ: кластера в объявленной среде нет,
# и проверить, что именно эта версия ставится, было нечем. Поле
# targetRevision несёт заведомо-заметный плейсхолдер, а не правдоподобное
# число: правдоподобное выглядело бы проверенным. Закрепляется первым
# развёртыванием (deploy/README.md §«Что не проверено прогоном»).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger-operator
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger-operator
    targetRevision: PIN-ON-FIRST-DEPLOY
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
