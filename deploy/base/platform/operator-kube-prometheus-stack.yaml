# Метрики и алерты: Prometheus, Grafana, Alertmanager. Бизнес-алерты идут от событий, но носитель факта — запись, не алерт (docs/concept.md, П3).
#
# ВЕРСИЯ ЗАКРЕПЛЕНА ПЕРВЫМ РАЗВЁРТЫВАНИЕМ (локальный стенд, 2026-09-05):
# именно эта версия поднялась в кластере, а не выбрана по индексу чарта
# (.claude/skills/local-stand.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 89.2.2
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
