# Оператор Kafka. Темы заводит шаг сервиса-производителя, не этот шаг (docs/architecture/contracts.md §События, «Событие → тема»).
#
# ВЕРСИЯ ЗАКРЕПЛЕНА ПЕРВЫМ РАЗВЁРТЫВАНИЕМ (локальный стенд, 2026-09-05):
# именно эта версия поднялась в кластере, а не выбрана по индексу чарта
# (.claude/skills/local-stand.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi-kafka-operator
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://strimzi.io/charts
    chart: strimzi-kafka-operator
    targetRevision: 1.2.0
    helm:
      valuesObject:
        # Оператор по умолчанию смотрит ТОЛЬКО своё пространство имён, а
        # кластеры Kafka живут в пространствах окружений: без этой строки
        # ресурс Kafka создаётся и остаётся без статуса — никто его не
        # берёт. Обнаружено первым развёртыванием (локальный стенд).
        watchAnyNamespace: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
