# Оператор Elastic. Логи: структурированный JSON из сервиса → сборщик на узле → Elasticsearch → Kibana.
#
# ВЕРСИЯ ЗАКРЕПЛЕНА ПЕРВЫМ РАЗВЁРТЫВАНИЕМ (локальный стенд, 2026-09-05):
# именно эта версия поднялась в кластере, а не выбрана по индексу чарта
# (.claude/skills/local-stand.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://helm.elastic.co
    chart: eck-operator
    targetRevision: 3.5.0
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
