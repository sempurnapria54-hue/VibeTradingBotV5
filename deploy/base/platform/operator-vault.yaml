# Vault. Схема путей — docs/architecture/platform.md §Безопасность; роли привязаны к ServiceAccount сервиса в его пространстве имён.
#
# ВЕРСИЯ ЗАКРЕПЛЕНА ПЕРВЫМ РАЗВЁРТЫВАНИЕМ (локальный стенд, 2026-09-05):
# именно эта версия поднялась в кластере, а не выбрана по индексу чарта
# (.claude/skills/local-stand.md).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: 0.34.1
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
