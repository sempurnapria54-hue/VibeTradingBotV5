# Vault. Схема путей — docs/architecture/platform.md §Безопасность; роли привязаны к ServiceAccount сервиса в его пространстве имён.
#
# ВЕРСИЯ ЧАРТА НЕ ЗАКРЕПЛЕНА ПРОГОНОМ: кластера в объявленной среде нет,
# и проверить, что именно эта версия ставится, было нечем. Поле
# targetRevision несёт заведомо-заметный плейсхолдер, а не правдоподобное
# число: правдоподобное выглядело бы проверенным. Закрепляется первым
# развёртыванием (deploy/README.md §«Что не проверено прогоном»).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://helm.releases.hashicorp.com
    chart: vault
    targetRevision: PIN-ON-FIRST-DEPLOY
  destination:
    server: https://kubernetes.default.svc
    namespace: vault-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
