# Пространство имён окружения. Имя подставляет оверлей: окружения — это
# пространства имён одного кластера до выбора облака, после — `prod`
# отдельным кластером (docs/architecture/platform.md §Развёртывание).
# Форма манифеста от этого перехода не зависит: меняется адресат, не файл.
apiVersion: v1
kind: Namespace
metadata:
  name: placeholder
  labels:
    # Метка окружения — операнд сетевых политик и меток наблюдаемости.
    # Значение подставляет оверлей окружения.
    platform.vibetrading/environment: placeholder
