# Приёмник трейсов окружения. Контекст трейса проходит через REST и через
# конверт события; tenantId и strategyId — атрибуты каждого спана с
# первого дня (docs/architecture/platform.md §Наблюдаемость).
#
# БЕЗ ОПЕРАТОРА, И ЭТО НАЗВАННЫЙ ВЫБОР. Оператор Jaeger снят первым
# развёртыванием по двум несовместимостям сразу: он требует cert-manager
# для сертификата своего вебхука и падает на согласовании ЛЮБОГО инстанса,
# потому что ищет CRD Kafka версии `kafka.strimzi.io/v1beta2`, которой
# оператор Kafka 1.x уже не отдаёт (флага, отключающего этот поиск, у него
# нет — проверено прогоном). Один инстанс «всё в одном» не нуждается в
# контроллере: у него нет ни масштабирования, ни выкатки версий, ни
# состояния, которым надо управлять.
#
# ХРАНЕНИЕ — В ПАМЯТИ, и это не упущение: трейсы нужны для разбора
# «здесь и сейчас», а носителем факта служит ЗАПИСЬ, не трейс
# (docs/concept.md, П3). Долговременное хранилище трейсов приезжает, когда
# у него появится потребитель.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-tracing
  labels:
    app.kubernetes.io/name: platform-tracing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-tracing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-tracing
    spec:
      containers:
        - name: jaeger
          # Версия закреплена первым развёртыванием (локальный стенд).
          image: jaegertracing/jaeger:2.20.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 16686
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: platform-tracing
spec:
  selector:
    app.kubernetes.io/name: platform-tracing
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 16686
      targetPort: ui
---
# Приём трейсов от сервисов окружения. Правило встречное к исходящему у
# каждого сервиса; сами сервисы шлют трейсы, когда в них включён экспорт
# OpenTelemetry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tracing-ingress-from-services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: platform-tracing
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connector-okx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: market-data
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
