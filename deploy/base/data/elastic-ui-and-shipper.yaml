# Тропа логов до приёмника: сборщик на узле и интерфейс чтения.
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ И ПОЧЕМУ ВООБЩЕ. Дом наблюдаемости объявляет
# тропу целиком: «структурированный JSON из каждого сервиса → сборщик на
# узле → Elasticsearch → Kibana» (docs/architecture/platform.md
# §Наблюдаемость). Первое развёртывание показало, что из четырёх звеньев в
# манифестах стои́т одно — приёмник; сборщика и интерфейса не было, то есть
# логи никуда не ехали, а объявленная тропа существовала только на бумаге.
#
# Версии закреплены первым развёртыванием и совпадают с версией приёмника:
# у стека Elastic компоненты разных версий друг с другом не работают.
apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: platform-logs-ui
spec:
  version: 9.5.3
  count: 1
  elasticsearchRef:
    name: platform-logs
  config:
    # TLS у интерфейса выключен: снаружи он не публикуется вовсе, а внутри
    # кластера транспорт открыт названным выбором (docs/architecture/platform.md
    # §Безопасность, «Транспорт внутри кластера»). Доступ — прокидыванием
    # порта (.claude/skills/local-stand.md).
    server.publicBaseUrl: http://localhost:5601
  http:
    tls:
      selfSignedCertificate:
        disabled: true
---
apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: platform-log-shipper
spec:
  type: filebeat
  version: 9.5.3
  elasticsearchRef:
    name: platform-logs
  config:
    filebeat.inputs:
      - type: filestream
        id: container-logs
        paths:
          - /var/log/containers/*.log
        parsers:
          - container: {}
    processors:
      # Метки пода нужны, чтобы строка лога отвечала на вопрос «чья она»:
      # без этого приёмник хранит текст без адресата.
      - add_kubernetes_metadata:
          host: ${NODE_NAME}
          matchers:
            - logs_path:
                logs_path: /var/log/containers/
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: platform-log-shipper
        automountServiceAccountToken: true
        terminationGracePeriodSeconds: 30
        dnsPolicy: ClusterFirstWithHostNet
        hostNetwork: true
        securityContext:
          runAsUser: 0
        containers:
          - name: filebeat
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
              - name: varlogpods
                mountPath: /var/log/pods
              - name: varlibdockercontainers
                mountPath: /var/lib/docker/containers
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: varlogpods
            hostPath:
              path: /var/log/pods
          - name: varlibdockercontainers
            hostPath:
              path: /var/lib/docker/containers
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-log-shipper
---
# Тропа логов внутри пространства имён. Запрет по умолчанию действует в обе
# стороны, поэтому у каждой пары названы оба конца: интерфейс читает
# приёмник, сборщик в него пишет.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: elasticsearch-ingress-from-log-path
spec:
  podSelector:
    matchExpressions:
      - key: elasticsearch.k8s.elastic.co/cluster-name
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              common.k8s.elastic.co/type: kibana
        - podSelector:
            matchLabels:
              common.k8s.elastic.co/type: beat
        # Сборщик работает в сети УЗЛА (иначе он не видит его файлов
        # логов), поэтому приходит не как под, а как адрес узла: селектора
        # пода для такого трафика не существует.
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 9200
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kibana-egress
spec:
  podSelector:
    matchLabels:
      common.k8s.elastic.co/type: kibana
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: elasticsearch.k8s.elastic.co/cluster-name
                operator: Exists
      ports:
        - protocol: TCP
          port: 9200
