# Vault окружения. Метод входа — Kubernetes: роль привязана к
# ServiceAccount сервиса в его пространстве имён, а пространство имён и
# есть окружение, поэтому «роль на свой префикс» и «роль своего
# окружения» — одно ограничение.
#
# Схема путей секретов НЕ ВОСПРОИЗВОДИТСЯ здесь ни в каком виде: её дом —
# docs/architecture/platform.md §Безопасность, и вторая копия разошлась бы
# первой (.claude/rules/carrier-levels.md). Манифест на схему только
# ссылается.
#
# Политики и роли конкретных сервисов здесь не заводятся: сервисов ещё
# нет, а политика без субъекта — разведочный режим без условия выхода.
# Каждая приезжает со своим сервисом, шагами 4-10 фазы 2.
#
# Установку Vault несёт ../platform/operator-vault.yaml; собственных
# ресурсов у окружения на этом шаге нет, и пустой манифест честнее
# ConfigMap-заглушки, пересказывающей чужой дом.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-bootstrap-note
data:
  home: "docs/architecture/platform.md §Безопасность"
