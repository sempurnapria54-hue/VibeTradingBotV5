# Elasticsearch окружения: приёмник структурированных логов сервисов.
# Секреты в логах не появляются — это обязанность автора кода
# (.claude/rules/codestyle.md §Логирование), а не фильтра на приёмнике.
apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: platform-logs
spec:
  # Версия закреплена первым развёртыванием (локальный стенд, 2026-09-05):
  # именно она поднялась под оператором ECK 3.5.0.
  version: 9.5.3
  nodeSets:
    - name: default
      count: 1
      config:
        node.store.allow_mmap: false
      # Том объявлен явно: без шаблона оператор берёт умолчание 1 ГиБ, и
      # приёмник логов переполнился бы первым из данных окружения.
      # Число — непроизводственное, того же порядка, что у базы и брокера;
      # назначение по наблюдаемому потреблению — задача
      # .claude/work/backlog.md, пункт о размерах томов данных.
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
