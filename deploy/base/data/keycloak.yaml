# Провайдер идентичности окружения. Платформа хранит только идентификатор
# пользователя; учётные данные, сессии и токены — здесь
# (docs/architecture/tenant-and-exchange.md §«Пользователи и роли»).
#
# Реалмы, клиенты и мапперы заводит шаг 4 фазы 2 вместе с сервисом auth:
# они бессмысленны без тенантов, которых ещё нет.
#
# База провайдера — своя, как у любого писателя
# (docs/architecture/data-ownership.md §Раскладка, строка «провайдер
# идентичности»): её объявляет ресурс Database ниже, роль-владелец —
# кластер (postgres-cluster.yaml), пароль — секрет вне репозитория.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: keycloak
spec:
  cluster:
    name: platform-postgres
  name: keycloak
  owner: keycloak
---
apiVersion: k8s.keycloak.org/v2beta1
kind: Keycloak
metadata:
  name: platform-identity
spec:
  instances: 1
  db:
    vendor: postgres
    host: platform-postgres-rw
    database: keycloak
    usernameSecret:
      name: postgres-role-keycloak
      key: username
    passwordSecret:
      name: postgres-role-keycloak
      key: password
  # HTTP внутри кластера — НАЗВАННЫЙ выбор, не умолчание:
  # docs/architecture/platform.md §Безопасность, «Транспорт внутри
  # кластера». Условие пересмотра — перед первым развёртыванием prod.
  http:
    httpEnabled: true
  # ИЗДАТЕЛЬ ТОКЕНОВ — ИМЯ ХОСТА ОКРУЖЕНИЯ (docs/architecture/platform.md
  # §Безопасность). Адрес закреплён, а не выводится из запроса: иначе токен,
  # взятый браузером снаружи, и токен, взятый сервисом внутри, несли бы
  # разных издателей, и каждый владелец принимал бы обоих. Внутренние адреса
  # остаются рабочими (backchannelDynamic): по ним сервисы берут ключи
  # подписи и служебные токены, наружу не выходя. Здесь стои́т значение
  # `dev`; оверлей окружения подменяет его своим именем хоста.
  hostname:
    hostname: https://dev.vibetrading.invalid
    backchannelDynamic: true
  # TLS терминирует ингресс; провайдер узнаёт о схеме запроса из заголовков
  # X-Forwarded-*, которые ставит контроллер. Без них он считал бы вход
  # открытым и выставлял бы браузеру куки сессии входа без признака
  # защищённости.
  proxy:
    headers: xforwarded
---
# Встречное разрешение на стороне провайдера: подпись входящего токена
# каждый сервис проверяет ЛОКАЛЬНО, но ключи подписи забирает у него, а
# market-data ещё и берёт токен для исходящего вызова. Запрет по умолчанию
# действует в обе стороны, поэтому исходящего правила у сервисов мало.
# Здесь — сервисы первого развёртывания; прочие приносят своё правило
# `identity-ingress-from-<сервис>` в собственном манифесте.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: identity-ingress-from-services
spec:
  podSelector:
    matchLabels:
      app: keycloak
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: auth
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: connector-okx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: market-data
      ports:
        - protocol: TCP
          port: 8080
---
# Встречное разрешение на стороне базы: провайдер идентичности — такой же
# писатель своей базы, как любой сервис (см. довод у auth.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-from-identity
spec:
  podSelector:
    matchExpressions:
      - key: cnpg.io/cluster
        operator: Exists
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/managed-by: keycloak-operator
      ports:
        - protocol: TCP
          port: 5432
