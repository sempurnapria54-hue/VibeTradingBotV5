services:
  vault:
    image: hashicorp/vault:1.15
    container_name: vibetradingbotv5-vault
    entrypoint: ["vault"]
    ports:
      - "8200:18200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_data:/vault/file
      - ./vault.hcl:/vault/config/vault.hcl:ro
    command: ["server", "-config=/vault/config/vault.hcl"]

  db:
    image: postgres:16
    container_name: vibetradingbotv5-db
    env_file:
      - ./.env.local
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
  vault_data: