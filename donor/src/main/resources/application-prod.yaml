# Профиль prod: Vault-пути secret/tradingbot/postgres (datasource) +
# secret/tradingbot/okx (OKX-креды). Ключи секретов (заполняет пользователь):
# postgres → DATASOURCE_URL / DATASOURCE_USERNAME / DATASOURCE_PASSWORD (URL → :5440);
# okx → OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE.
spring:
  config:
    import:
      - vault://secret/tradingbot/postgres
      - vault://secret/tradingbot/okx
      - vault://secret/tradingbot/api-access
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

okx:
  # prod — реальный трейдинг: simulated пусто (header x-simulated-trading не demo).
  simulated: ${OKX_SIMULATED:}

# Загрузка свечей (docs/processes/candle-loading.md). Числа
# конфигурируемы, проставляются на CODE.
candle-loading:
  # Выключатель джобы загрузки свечей (CandleJob).
  enabled: ${CANDLE_JOB_ENABLED:true}
  # Период тика CandleJob (CRON), порядка раза в минуту.
  cron: ${CANDLE_JOB_CRON:0 * * * * *}
  # Лимит свечей в одном запросе OKX history-candles (max 100).
  page-size: 100
  # Число попыток REPAIR до перевода группы в ERROR.
  max-repair-attempts: 5
  # Перекрытие хвоста при SYNC (число последних баров перезапрашивается).
  sync-overlap-bars: 3
  # Дефолтный плановый горизонт истории (UTC мс) при онбординге
  # инструмента, если не задан явно.
  default-planned-start-date: ${CANDLE_DEFAULT_PLANNED_START:0}
  # Таймфреймы, под которые заводятся группы свечей инструмента.
  # На шаге 1 (без стратегии) — из конфига; со стратегией (шаг 2) —
  # из запрошенных стратегией индикаторов.
  timeframes:
    - ONE_HOUR

# Расчёт производных рыночных данных (docs/processes/market-data-calculation.md):
# индикаторы → структура → фаза. По джобе — выключатель и CRON;
# идемпотентность и чтение-последнего обеспечивают сходимость порядка
# между jobs. candle-window-bars — потолок недавнего окна свечей,
# грузимого в расчёт (защита от тяжёлых запросов по всей истории).
market-data:
  candle-window-bars: ${MARKET_DATA_CANDLE_WINDOW_BARS:1500}
  indicator:
    enabled: ${INDICATOR_JOB_ENABLED:true}
    cron: ${INDICATOR_JOB_CRON:0 * * * * *}
  structure:
    enabled: ${MARKET_STRUCTURE_JOB_ENABLED:true}
    cron: ${MARKET_STRUCTURE_JOB_CRON:0 * * * * *}

# Синхронизация внешних правил инструмента
# (docs/components/InstrumentExternalRulesSyncJob.md): спецификация
# биржи (tick/lot/min size, per-order max sizes, ctVal, max leverage,
# торгуемость) — источник ограничений риск-преконтроля. Меняется редко →
# тик не частый (по умолчанию раз в час).
instrument-external-rules-sync:
  enabled: ${INSTRUMENT_RULES_SYNC_ENABLED:true}
  cron: ${INSTRUMENT_RULES_SYNC_CRON:0 0 * * * *}

# Поиск входов (docs/components/EntryScannerJob.md): сканирует активные
# инструменты под ENTRY/GRID_ENTRY condition активной стратегии. Частота —
# провизорное число (бэктест/наблюдения).
entry-scanner:
  enabled: ${ENTRY_SCANNER_ENABLED:true}
  cron: ${ENTRY_SCANNER_CRON:0 * * * * *}

# Сопровождение сделок (docs/components/DealOrchestratorJob.md): гоняет
# активные Deal через FSM. Concurrency-guard прохода — БД advisory lock
# (D-M1). batch-size — окно выборки активных сделок за проход. Частота —
# провизорное число.
deal-orchestrator:
  enabled: ${DEAL_ORCHESTRATOR_ENABLED:true}
  cron: ${DEAL_ORCHESTRATOR_CRON:0 * * * * *}
  batch-size: ${DEAL_ORCHESTRATOR_BATCH_SIZE:100}

# Детектор аномалий (docs/components/AnomalyJob.md): ищет активную позицию
# без сделки, объясняющей её появление, и заводит вокруг неё сделку
# восстановительной тропой. Частота — провизорное число.
anomaly-job:
  enabled: ${ANOMALY_JOB_ENABLED:true}
  cron: ${ANOMALY_JOB_CRON:30 * * * * *}

# ─── РИСК-АППЕТИТ ────────────────────────────────────────────────────────────
# Три числа, которыми система ограничивает саму себя. Смысл, единица и роль
# каждого в формулах — docs/rules/risk-policy.md §«Числа назначает держатель;
# пустое место — отказ» и docs/rules/loss-streak-halt.md.
#
# ЗДЕСЬ СТОЯ́Т ВРЕМЕННЫЕ ЧИСЛА — КОПИЯ ПРОФИЛЯ TEST, А НЕ БОЕВОЕ НАЗНАЧЕНИЕ
# (решение держателя 2026-09-03). Боевые числа назначаются в КОНЦЕ ФАЗЫ 1,
# перед первым запуском prod: они выражают, чем держатель готов рисковать, и
# машиной не выводятся. До тех пор профиль заполнен значениями demo-контура,
# чтобы `RiskAppetiteStartupCheck` не держал подъём приложения на пустом
# месте (`docs/rules/risk-policy.md` §«Числа назначает держатель; пустое
# место — отказ»).
#
# ЧИСЛА НИЖЕ БОЕВЫМИ НЕ ЯВЛЯЮТСЯ. Носитель со стороны события, чтобы они не
# ушли в бой незамеченными, — `.claude/work/backlog.md` §«Боевые числа
# риск-аппетита — назначение держателем перед первым запуском prod»;
# срабатывает гейтом закрытия фазы 1
# (`.claude/skills/update-roadmap-progress.md` §«Гейт закрытия фазы»).
#
# Пустое число система не пропускает, а ОТКАЗЫВАЕТ — адресно, каждое в своём
# месте (см. ниже). Переназначить можно здесь либо переменной окружения
# (RISK_APPETITE_GLOBAL_SIMULTANEOUS_RISK_PER_DEAL_PERCENT и т. д.).
risk-appetite:

  # Максимальный риск на одну сделку, проценты базы риска (свободного остатка
  # счёта). Потолок одновременного риска сделки и первый сомножитель
  # катастрофического потолка. Больше — сделки крупнее и просадка серии
  # глубже; меньше — размер упирается в минимальный лот и торговли не будет.
  # Пусто — отвергается всякое действие, создающее риск.
  #
  # 1.0 — ВРЕМЕННО, значение профиля test (учебниковый ориентир demo-контура).
  global-simultaneous-risk-per-deal-percent: 1.0

  # Планка множителя катастрофического потолка: во сколько раз стратегии
  # позволено растянуть «сколько сделка потеряет в худшем мыслимом исходе»
  # сверх числа выше. Сам множитель объявляет стратегия, здесь — предел, выше
  # которого её объявление не принимается. Потолок он же кэп суммарного
  # номинала сделки. Пусто — отвергается создание стратегии.
  #
  # 100.0 — ВРЕМЕННО, значение профиля test (при 1 % риска даёт потолок в одну
  # базу).
  global-catastrophic-risk-per-deal-multiplier: 100.0

  # Сколько подряд ценово-убыточных закрытых сделок останавливают торговлю
  # целиком (мягкая ступень биржевого холда, разбор руками). Прибыльная сделка
  # обнуляет счётчик. Больше — убытки копятся дольше до разбора; меньше —
  # торговля встаёт на обычной полосе невезения. Пусто — отвергается всякое
  # действие, создающее риск.
  #
  # 3 — ВРЕМЕННО, значение профиля test.
  global-consecutive-loss-limit: 3

logging:
  level:
    com.example.tradingbot: INFO
