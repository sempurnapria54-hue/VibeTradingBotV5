# Детерминированный порядок прогона код-тестов контура source-api.
#
# На какой вопрос отвечает этот файл: каким порядком JUnit выполняет тест-классы
# и тест-методы (нужно, чтобы halt-флаг «невычищаемое грязное состояние → стоп
# прогона» был осмысленным — «дальше не идём» определено только при заданном
# порядке).
#
# Классы — по @Order на классе (структура плана: M1–M21 → TG → AG → MG → PG,
# 1..60); методы — по @Order на @Test (порядок кейсов внутри эндпоинта по плану).
# Источник правды порядка — аннотации @Order в тестах; этот файл лишь включает
# соответствующие orderers по умолчанию для всего движка Jupiter.
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$OrderAnnotation
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$OrderAnnotation
