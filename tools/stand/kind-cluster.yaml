# Форма кластера локального стенда.
#
# ПРЕДМЕТ: один узел, на котором живут все пространства имён — окружения
# (`dev`/`stage`/`prod`) и системные (операторы, Argo CD). Ровно та же
# раскладка, что описана в docs/architecture/platform.md §Развёртывание
# для случая «до выбора облака»; отличие стенда только в том, ЧЕМ поднят
# сам кластер.
#
# Проброс порта — вход снаружи окружения. Объект Ingress приехал с bff раньше
# контроллера, который его исполнит; контроллер стои́т кластерным слоем
# (deploy/base/platform/ingress-controller.yaml) и слушает порт 443 узла, а
# этот проброс выводит его на тот же порт хоста.
#
# ПОРТ ХОСТА — 443, А НЕ ПРОИЗВОЛЬНЫЙ. Провайдер идентичности строит адреса
# входа и издателя токенов от имени хоста окружения без порта
# (deploy/base/data/keycloak.yaml): браузер и дым, отправленные им на
# `https://<хост>/…`, приходят на 443. Проброс на другой порт хоста оставил бы
# тропу токена разорванной на первой же переадресации.
#
# Открытого порта 80 нет: снаружи трафик приходит только по TLS
# (docs/architecture/platform.md §Безопасность).
#
# ПРОБРОС ЗАДАЁТСЯ ПРИ СОЗДАНИИ КЛАСТЕРА и на живом узле не меняется: кластер,
# созданный прежней формой (80→8081, 443→8443), получает эту только
# пересозданием — `.claude/skills/local-stand.md` §«Снятие» и §«Постановка».
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vibetrading
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 443
        hostPort: 443
        protocol: TCP
