# Конфиг цепочки сессий: умолчания tools/session-loop.sh и
# tools/session-unattended.sh. Единственный дом значений ручек — сценарии
# своих умолчаний не держат, а без этого файла отказывают.
#
# ФОРМА. Строка — КЛЮЧ=значение; значение до конца строки как есть, без
# кавычек; пустое значение — «не задан». `${LOCALAPPDATA}` и `${HOME}`
# подставляются.
# Иных подстановок нет: файл читается, а не исполняется.
#
# ПРИОРИТЕТ. Переменная окружения, если задана, перекрывает строку файла;
# предполётная проверка обоих сценариев печатает, откуда взято каждое
# значение. Ключ вне перечня и пропущенный ключ — отказ предполётной проверки.
#
# СЕКРЕТОВ ЗДЕСЬ НЕТ, и файл под версионированием. Появится секрет — ему
# место в локальном файле по образцу `.env.*.local`, а не здесь.
#
# Смысл каждой ручки — .claude/skills/session-chain.md §«Ручки».

# --- сессия
SESSION_TIMEOUT=4h
SESSION_MAX_USD=
SESSION_MODEL=
SESSION_EFFORT=high
SESSION_PERMISSION_MODE=bypassPermissions
SESSION_PROMPT=tools/session-prompt.md
SESSION_SKIP_PROBE=

# --- журнал и стенд
SESSION_LOOP_DIR=${LOCALAPPDATA}/vibetrading-stand/sessions
SESSION_MIN_FREE_GIB=10
# Адреса через `:` — Windows (образ WSL) и macOS (Docker.raw Docker Desktop);
# берётся первый, где образ есть.
SESSION_DOCKER_DATA_DIR=/d/Docker containers/DockerDesktopWSL:${HOME}/Library/Containers/com.docker.docker/Data/vms/0/data

# --- режим без присмотра
SESSION_UNATTENDED_PAUSE=1800
SESSION_UNATTENDED_LOOP=tools/session-loop.sh
